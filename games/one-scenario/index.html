<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>One Scenario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
    <style>
      :root{
        /* 8-colour palette — 70s sci-fi paperback, printed not pixellated */
        --void:#0f111a;
        --paper:#f2e8cf;
        --gold:#e9c46a;
        --rust:#e76f51;
        --teal:#2a9d8f;
        --steel:#457b9d;
        --ice:#a8dadc;
        --signal:#bc4749;
        --ink:var(--void);
        --ink-soft:var(--void);
        --panel:var(--paper);
        --page:var(--void);
        --hairline:var(--ice);
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0;
        background:var(--page);
        background-image:radial-gradient(rgba(233,196,106,.14) 1px, transparent 1.3px);
        background-size:11px 11px;
        color:var(--ink);
        font-family:"Archivo", system-ui, sans-serif;
        display:flex; justify-content:center;
      }
      button{ font-family:inherit; cursor:pointer; }
      button:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }

      .device{
        width:100%; max-width:560px; min-height:100dvh;
        display:flex; flex-direction:column;
        padding:14px 12px calc(14px + env(safe-area-inset-bottom));
        gap:14px;
      }
      @media (min-width:560px){
        .device{ min-height:0; margin:26px 0; }
        body{ align-items:flex-start; }
      }

      /* ---------- FRAME 1 · PICTURE ---------- */
      .frame-pic{
        background:var(--panel);
        border:1.5px solid var(--ink);
        padding:10px 10px 8px;
        box-shadow:10px 10px 0 rgba(15,17,26,.5);
        flex:none;
      }
      .frame-pic canvas{
        display:block; width:100%; aspect-ratio:4/3;
        background:var(--paper);
        border:1.5px solid var(--ink);
      }
      .pic-caption{
        display:flex; justify-content:space-between; align-items:center; gap:10px;
        padding-top:9px;
        font-family:"IBM Plex Mono", ui-monospace, monospace;
        font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink);
      }
      .pic-live{ display:flex; align-items:center; gap:7px; white-space:nowrap; }
      .pic-live i{ width:7px; height:7px; border-radius:50%; background:var(--signal); display:block; animation:blink 1s steps(1) infinite; }
      @keyframes blink{ 50%{ opacity:0; } }

      /* ---------- FRAME 2 · STORY ---------- */
      .frame-story{
        flex:none;
        background:var(--panel);
        border:1.5px solid var(--ink);
        box-shadow:10px 10px 0 rgba(15,17,26,.5);
        padding:22px 24px 20px;
      }
      .mission-line{
        display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
      }
      .mission-name{
        font-weight:800; font-size:15px; letter-spacing:.05em; text-transform:uppercase;
        line-height:1.4; margin:0;
      }
      .turn-tag{
        font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px; letter-spacing:.14em;
        border:1.5px solid var(--ink); background:var(--gold); color:var(--void);
        padding:4px 8px; white-space:nowrap;
      }
      .goal-line{
        font-family:"Newsreader", Georgia, serif; font-style:italic;
        font-size:17.5px; line-height:1.35; margin:10px 0 16px; color:var(--ink-soft);
      }
      .bars{ display:grid; gap:9px; margin-bottom:18px; }
      .bar-row{ display:grid; grid-template-columns:96px 1fr 40px; align-items:center; gap:10px; }
      .bar-label{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10px; letter-spacing:.16em; }
      .bar-track{ height:9px; border:1.5px solid var(--ink); position:relative; overflow:hidden; background:var(--panel); }
      .bar-fill{ position:absolute; inset:0; transform-origin:left; background:var(--teal); transition:width .5s ease; }
      .bar-fill.hull{ background:var(--steel); }
      .bar-fill.low{
        background:var(--signal);
        background-image:repeating-linear-gradient(45deg, var(--signal) 0 4px, var(--paper) 4px 8px);
      }
      .bar-val{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:13px; text-align:right; line-height:1; }
      .story-text{
        font-family:"Newsreader", Georgia, serif;
        font-size:23px; line-height:1.42; margin:0 0 10px; min-height:98px; color:var(--ink);
      }
      .story-text .cursor{ display:inline-block; width:10px; height:18px; background:var(--ink); vertical-align:-2px; margin-left:2px; animation:blink 1.1s steps(1) infinite; }
      .log-line{
        font-family:"IBM Plex Mono", ui-monospace, monospace;
        font-size:12.5px; line-height:1.5; color:var(--ink-soft); margin:0;
        border-top:1px dashed var(--hairline); padding-top:10px;
      }
      .log-line:empty{ display:none; }
      .howto{
        font-family:"Newsreader", Georgia, serif; font-style:italic;
        font-size:16.5px; line-height:1.45; margin:14px 0 0; color:var(--ink-soft);
      }
      .howto b{ color:var(--ink); font-style:normal; }

      /* ---------- FRAME 3 · TOOLBAR ---------- */
      .frame-tools{
        flex:none; background:var(--panel);
        border:1.5px solid var(--ink);
        box-shadow:10px 10px 0 rgba(15,17,26,.5);
        padding:12px;
      }
      .actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .actions.single{ grid-template-columns:1fr; }
      .act-btn{
        min-height:68px; padding:13px 15px; text-align:left;
        background:var(--ink); color:var(--paper);
        border:1.5px solid var(--ink); border-radius:2px;
        display:flex; flex-direction:column; gap:4px; justify-content:center;
        transition:transform .12s ease, background .12s ease;
      }
      .act-btn:hover{ background:var(--steel); transform:translateY(-1px); }
      .act-btn:active{ transform:translateY(1px); }
      .act-btn:disabled{ opacity:.38; cursor:not-allowed; transform:none; }
      .act-btn .a-name{ font-weight:700; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; line-height:1.5; }
      .act-btn .a-sub{ font-family:"Newsreader", Georgia, serif; font-size:15.5px; line-height:1.15; opacity:.72; }
      .act-btn .a-key{
        align-self:flex-start; font-family:"IBM Plex Mono", ui-monospace, monospace;
        font-size:10px; line-height:1; border:1px solid var(--gold); color:var(--gold);
        padding:3px 5px;
      }
      .menu-actions{ display:grid; grid-template-columns:1fr; gap:10px; }
      @media (min-width:480px){ .menu-actions{ grid-template-columns:1fr 1fr 1fr; } .menu-actions .act-btn{ min-height:112px; } }
      .util-row{ display:flex; gap:10px; margin-top:10px; }
      .util-btn{
        flex:1; min-height:42px; padding:8px 6px;
        background:transparent; color:var(--ink);
        border:1.5px solid var(--ink); border-radius:2px;
        font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10px; letter-spacing:.14em; line-height:1.5;
        transition:background .12s ease, color .12s ease;
      }
      .util-btn:hover{ background:var(--teal); border-color:var(--teal); color:var(--paper); }
      .util-btn:active{ transform:translateY(1px); }
      .hidden{ display:none !important; }
      @media (prefers-reduced-motion: reduce){
        .pic-live i, .story-text .cursor{ animation:none; }
        .act-btn, .util-btn, .bar-fill{ transition:none; }
        .act-btn:hover, .act-btn:active, .util-btn:active{ transform:none; }
      }
    </style>
  </head>
  <body>
    <div class="device">

      <!-- FRAME 1 · PICTURE -->
      <section class="frame-pic" aria-label="Scene">
        <canvas id="screen" width="480" height="360"></canvas>
        <div class="pic-caption">
          <span id="picTag">THE STARPORT</span>
          <span class="pic-live"><i></i><span id="picLive">SHIP 08:00</span></span>
        </div>
      </section>

      <!-- FRAME 2 · STORY -->
      <section class="frame-story" aria-live="polite">
        <div class="mission-line">
          <h1 class="mission-name" id="missionName">ONE SCENARIO</h1>
          <span class="turn-tag" id="turnTag"></span>
        </div>
        <p class="goal-line" id="goalLine">Pilot · Engineer · Scout — pick a past, take the stars.</p>
        <div class="bars" id="bars"></div>
        <p class="story-text" id="storyText"></p>
        <p class="log-line" id="logLine"></p>
        <p class="howto" id="howto"><b>The ship's clock runs in real time.</b> Pick a past, meet the captain, then chart the dark — every jump generates the next world from the last, and the menu is whatever the void offers.</p>
      </section>

      <!-- FRAME 3 · TOOLBAR -->
      <section class="frame-tools">
        <div class="actions" id="actions"></div>
        <div class="util-row">
          <button class="util-btn" id="btnHome" type="button">◀ STARPORT</button>
          <button class="util-btn" id="btnRestart" type="button">↻ RESTART</button>
          <button class="util-btn" id="btnSound" type="button">SOUND: ON</button>
        </div>
      </section>

    </div>
    <script>
    "use strict";
    /* ============================================================
       ONE SCENARIO — a space RPG.
       No schools, no fixed plot. You stand at the starport,
       pick a past (pilot, engineer, scout), board the Kestrel,
       meet its captain and its ship-mind — and from there the
       voyage generates itself: planets, stations, belts,
       derelicts, anomalies. The menu is whatever the void offers.
       The ship's clock ticks in real time, and the dark does
       small things to the ship while you think.

       THE ART — 8 colours, pushed as far as eight go.
       The fine 8x8 Bayer halftone stays — 64 levels deep, now
       mixed across a fixed palette of eight: void, paper, gold,
       rust, teal, steel, ice and signal red. A 70s sci-fi
       paperback, printed in colour: skies graduate steel to
       paper, the giant burns gold and rust, aurora runs teal
       over ice, and the Meridian pulses gold, rust and teal.
       Soul over nostalgia — now in colour.
       ============================================================ */
    var VOID = "#0f111a", INK = "#0f111a", PAPER = "#f2e8cf",
        GOLD = "#e9c46a", RUST = "#e76f51", TEAL = "#2a9d8f",
        STEEL = "#457b9d", ICE = "#a8dadc", SIGNAL = "#bc4749";
    var cv = document.getElementById("screen");
    var ctx = cv.getContext("2d");
    var W = 480, H = 360;
    var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var TAU = Math.PI * 2;

    var BAYER8 = [
      [0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],
      [12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
      [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],
      [15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]
    ];
    var tileCache = {};
    function tile(level, color) {
      var key = color + ":" + level;
      if (tileCache[key]) return tileCache[key];
      var c = document.createElement("canvas"); c.width = 8; c.height = 8;
      var g = c.getContext("2d"); g.fillStyle = color;
      for (var y = 0; y < 8; y++)
        for (var x = 0; x < 8; x++)
          if (BAYER8[y][x] < level) g.fillRect(x, y, 1, 1);
      var p = ctx.createPattern(c, "repeat");
      tileCache[key] = p;
      return p;
    }
    /* halftone fill: t = coverage 0..1 of `color` dots */
    function shade(x, y, w, h, t, color) {
      if (t <= 0.004 || w <= 0 || h <= 0) return;
      if (t >= 0.996) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); return; }
      ctx.fillStyle = tile(Math.round(t * 64), color);
      ctx.fillRect(x, y, w, h);
    }
    function fill(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
    function bgFill(color) { fill(0, 0, W, H, color); }
    function vgrad(x, y, w, h, t0, t1, color, bands) {
      bands = bands || 44;
      var bh = h / bands;
      for (var i = 0; i < bands; i++)
        shade(x, y + i * bh, w, bh + 1.5, t0 + (t1 - t0) * (i / (bands - 1)), color);
    }
    function hgrad(x, y, w, h, t0, t1, color, bands) {
      bands = bands || 36;
      var bw = w / bands;
      for (var i = 0; i < bands; i++)
        shade(x + i * bw, y, bw + 1.5, h, t0 + (t1 - t0) * (i / (bands - 1)), color);
    }
    function disc(cx, cy, r, color) {
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    }
    function discShade(cx, cy, r, t, color) {
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
      shade(cx - r, cy - r, r * 2, r * 2, t, color); ctx.restore();
    }
    function ringS(cx, cy, r, color, lw) {
      ctx.strokeStyle = color; ctx.lineWidth = lw || 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    }
    function ellip(cx, cy, rx, ry, color) {
      ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.fill();
    }
    function ellipShade(cx, cy, rx, ry, t, color) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.clip();
      shade(cx - rx, cy - ry, rx * 2, ry * 2, t, color); ctx.restore();
    }
    function poly(pts, color) {
      ctx.fillStyle = color; ctx.beginPath();
      pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
      ctx.closePath(); ctx.fill();
    }
    function line(x1, y1, x2, y2, color, lw) {
      ctx.strokeStyle = color; ctx.lineWidth = lw || 2;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    function rnd(seed) { var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    function starfield(n, seed, color, ymax) {
      for (var i = 0; i < n; i++) {
        var sx = rnd(seed + i * 3.1) * W, sy = rnd(seed + i * 7.7 + 1) * (ymax || H);
        var b = rnd(seed + i * 13.3 + 2);
        if (b > 0.93) { fill(sx - 2, sy, 5, 1.6, color); fill(sx, sy - 2, 1.6, 5, color); }
        else if (b > 0.55) fill(sx, sy, 2, 2, color);
        else fill(sx, sy, 1.2, 1.2, color);
      }
    }
    function twinkle(t, seed, color) {
      if (REDUCED) return;
      for (var k = 0; k < 6; k++) {
        if (Math.sin(t / 640 + k * 1.7) < 0.25) continue;
        var sx = rnd(seed + k * 31.7) * W, sy = rnd(seed + k * 17.3 + 5) * H * 0.7;
        fill(sx - 3, sy, 7, 1.6, color); fill(sx, sy - 3, 1.6, 7, color);
      }
    }
    function groundShadow(x, y, w, t) { ellipShade(x, y, w, w * 0.2, t, INK); }
    function bob(t, slow) { return REDUCED ? 0 : Math.round(Math.sin(t / (slow || 320)) * 1.6); }

    /* ---------- figures: flat silhouettes, drawn not pixellated ---------- */
    function figure(x, y, hgt, kind, col, det, flip) {
      var u = hgt / 16, s = flip ? -1 : 1;
      function P(pts, c) {
        ctx.fillStyle = c; ctx.beginPath();
        pts.forEach(function (p, i) {
          var px2 = x + p[0] * u * s, py2 = y + p[1] * u;
          i ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2);
        });
        ctx.closePath(); ctx.fill();
      }
      function R(ox, oy, w, h, c) {
        var xx = s < 0 ? x - (ox + w) * u : x + ox * u;
        ctx.fillStyle = c; ctx.fillRect(xx, y + oy * u, w * u, h * u);
      }
      function C(ox, oy, r, c) {
        ctx.fillStyle = c; ctx.beginPath();
        ctx.arc(x + ox * u * s, y + oy * u, r * u, 0, TAU); ctx.fill();
      }
      if (kind === "robot") {
        R(-2.5, -5.6, 1.7, 5.6, col); R(0.8, -5.6, 1.7, 5.6, col);
        R(-2.9, -0.7, 2.5, 0.7, col); R(0.4, -0.7, 2.5, 0.7, col);
        R(-4.3, -10.8, 1.3, 5.0, col); R(3.0, -10.8, 1.3, 5.0, col);
        C(-3.65, -5.3, 0.85, col); C(3.65, -5.3, 0.85, col);
        R(-3.0, -11.2, 6.0, 5.8, col);
        R(-1.8, -10.4, 3.6, 2.6, det);
        C(-0.9, -9.1, 0.38, col); C(0.9, -9.1, 0.38, col); C(0, -9.1, 0.38, col);
        line(x, y - 14.6 * u, x, y - 16.1 * u, col, Math.max(2, u * 0.32));
        R(-2.2, -14.6, 4.4, 3.2, col);
        R(-1.7, -13.7, 3.4, 0.85, det);
        C(0, -16.35, 0.5, det);
        return;
      }
      if (kind === "alien") {
        P([[-1.5, -7], [-0.3, -7], [-0.5, 0], [-1.8, 0]], col);
        P([[1.5, -7], [0.3, -7], [0.5, 0], [1.8, 0]], col);
        P([[-2.0, -12.8], [-3.2, -5.0], [-2.2, -4.8], [-1.3, -12.2]], col);
        P([[2.0, -12.8], [3.2, -5.0], [2.2, -4.8], [1.3, -12.2]], col);
        P([[-2.0, -13.2], [-1.7, -6.8], [1.7, -6.8], [2.0, -13.2]], col);
        R(-0.5, -14.6, 1.0, 1.8, col);
        ctx.fillStyle = col; ctx.beginPath();
        ctx.ellipse(x, y - 16.1 * u, 1.55 * u, 2.05 * u, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = det; ctx.beginPath();
        ctx.ellipse(x - 0.62 * u * s, y - 15.9 * u, 0.27 * u, 0.55 * u, 0, 0, TAU); ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + 0.62 * u * s, y - 15.9 * u, 0.27 * u, 0.55 * u, 0, 0, TAU); ctx.fill();
        return;
      }
      /* humans */
      if (kind === "hero") R(3.1, -11.6, 2.1, 6.6, col);            /* backpack */
      P([[-2.7, -5.6], [-0.35, -5.6], [-0.75, 0], [-3.0, 0]], col);
      P([[2.7, -5.6], [0.35, -5.6], [0.75, 0], [3.0, 0]], col);
      R(-3.35, -0.7, 3.15, 0.7, col); R(0.2, -0.7, 3.15, 0.7, col);
      P([[-3.3, -11], [-4.7, -6.2], [-3.7, -5.7], [-2.8, -10.4]], col);
      P([[3.3, -11], [4.7, -6.2], [3.7, -5.7], [2.8, -10.4]], col);
      if (kind === "cap") P([[-3.4, -11.2], [-3.7, -4.2], [3.7, -4.2], [3.4, -11.2]], col);
      else P([[-3.3, -11.2], [-2.9, -5.4], [2.9, -5.4], [3.3, -11.2]], col);
      C(0, -12.9, 1.95, col);
      if (kind === "hero") {
        R(-1.95, -11.35, 3.9, 0.85, det);                          /* scarf */
        R(-2.9, -9.4, 5.8, 0.55, det);                             /* chest strap */
        if (!flip) R(3.1, -8.8, 2.1, 0.5, det);
      } else if (kind === "cap") {
        C(0, -13.55, 2.02, col);
        R(-2.7, -13.3, 5.4, 0.62, col);                            /* cap brim */
        C(0, -13.7, 0.45, det);                                    /* insignia */
        C(0, -9.6, 0.34, det); C(0, -8.2, 0.34, det);
      } else if (kind === "crew") {
        C(1.75, -14.3, 0.95, col);                                 /* bun */
        R(-1.6, -11.25, 3.2, 0.65, det);                           /* collar */
        R(-3.28, -8.6, 0.6, 2.2, det);
      } else if (kind === "spacer") {
        R(-1.25, -10.5, 1.15, 1.15, det);                          /* chest patch */
        ctx.strokeStyle = det; ctx.lineWidth = Math.max(2, u * 0.34);
        ctx.beginPath(); ctx.arc(x + 5.9 * u * s, y - 6.2 * u, 1.9 * u, 0, TAU); ctx.stroke();
      }
    }

    /* ---------- scenes (picture frame) ---------- */
    function drawStarport(t) {
      bgFill(PAPER);
      vgrad(0, 0, W, 302, 0.55, 0.04, STEEL, 42);                  /* dawn sky, steel to paper */
      vgrad(0, 190, W, 112, 0.22, 0, RUST, 18);                    /* rust light low on the horizon */
      disc(394, 84, 29, GOLD); ringS(394, 84, 29, INK, 2);
      discShade(386, 78, 7, 0.35, RUST); discShade(402, 92, 5, 0.3, RUST);
      /* distant port skyline, faded by haze */
      fill(14, 168, 36, 134, INK); fill(20, 148, 24, 22, INK);
      fill(428, 128, 32, 174, INK); line(444, 128, 444, 96, INK, 3);
      fill(66, 226, 52, 76, INK); fill(356, 240, 44, 62, INK);
      shade(0, 120, W, 182, 0.42, PAPER);
      for (var wn = 0; wn < 7; wn++) {                              /* lit windows in the towers */
        fill(22 + (wn % 3) * 9, 182 + Math.floor(wn / 3) * 26, 4, 6, GOLD);
        fill(436 + (wn % 2) * 10, 150 + wn * 20, 4, 6, GOLD);
      }
      /* the Kestrel on the pad */
      var hull = [[92, 198], [148, 166], [332, 166], [396, 196], [386, 226], [138, 230], [92, 216]];

      renderPanel();
      elActions.innerHTML = "";
      elActions.className = "actions";
      var again = document.createElement("button");
      again.type = "button"; again.className = "act-btn";
      again.innerHTML = '<span class="a-name">↻ NEW VOYAGE</span><span class="a-sub">Same past, a fresh star chart</span>';
      again.addEventListener("click", function () { startRole(G.role); });
      var pick = document.createElement("button");
      pick.type = "button"; pick.className = "act-btn";
      pick.innerHTML = '<span class="a-name">◀ THE STARPORT</span><span class="a-sub">Stand on the pad again, choose again</span>';
      pick.addEventListener("click", toStart);
      elActions.appendChild(again); elActions.appendChild(pick);
    }

    function toStart() {
      G.screen = "start"; G.stage = "start"; G.role = null; G.place = "starport";
      elTag.textContent = "THE STARPORT";
      elName.textContent = "ONE SCENARIO";
      elGoal.textContent = "Pilot · Engineer · Scout — pick a past, take the stars.";
      elTurn.textContent = "";
      elBars.innerHTML = "";
      elHow.classList.remove("hidden");
      setStory("The Kestrel sits on the pad with her hatch open and her lights warm, six jumps from a signal nobody has ever answered. You stand in the middle of the dock, bag packed, whole voyage unwritten. Who were you, before the dark?", "");
      elActions.innerHTML = "";
      elActions.className = "menu-actions";
      ["pilot", "engineer", "scout"].forEach(function (k, i) {
        var R = ROLES[k];
        var b = document.createElement("button");
        b.type = "button"; b.className = "act-btn";
        b.innerHTML = '<span class="a-key">' + (i + 1) + '</span><span class="a-name">' + R.tag + '</span><span class="a-sub">' + R.sub + '</span>';
        b.addEventListener("click", function () { startRole(k); });
        elActions.appendChild(b);
      });
    }

    /* ---------- panel ---------- */
    function barRow(label, pct, val, low) {
      var cls = low ? " low" : (label === "HULL" ? " hull" : "");
      return '<div class="bar-row"><span class="bar-label">' + label + '</span>' +
        '<div class="bar-track"><div class="bar-fill' + cls + '" style="width:' + pct + '%"></div></div>' +
        '<span class="bar-val">' + val + '</span></div>';
    }
    function renderPanel() {
      if (G.screen === "start" || !G.role) return;
      var R = ROLES[G.role];
      elTurn.textContent = (G.stage === "end" || G.stage === "lost") ? "VOYAGE OVER" : (G.stage === "finale" ? "THE MERIDIAN" : "JUMP " + G.jump);
      elGoal.textContent = "SSV KESTREL — Fuel " + G.fuel + " · Credits " + G.credits + " · Data " + G.data + " · Crew " + G.crew;
      elBars.innerHTML =
        barRow(R.skill, clamp(G.skill * 4, 0, 100), G.skill + "", false) +
        barRow("HULL", G.hull, G.hull + "", G.hull <= 25);
    }

    /* ---------- real-time ship clock + the living dark ---------- */
    function fmtClock() {
      var h = Math.floor(G.clock / 60) % 24, m = G.clock % 60;
      return "SHIP " + (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
    }
    setInterval(function () {
      G.clock = (G.clock + 20) % (24 * 60);
      elLive.textContent = fmtClock();
      G.tick++;
      if (G.tick % 45 === 0 && G.screen === "scene" && G.stage === "pool" && !document.hidden) {
        var ev = AMBIENT[Math.floor(Math.random() * AMBIENT.length)];
        applyFx(ev.fx);
        setLogOnly(ev.log);
        renderPanel();
        if (G.hull <= 0) endGame(true);
      }
    }, 1000);

    /* ---------- picture loop ---------- */
    function draw(now) {
      var fn = DRAW[G.place] || drawStarport;
      fn(now);
    }
    (function loop(now) {
      draw(now || 0);
      setTimeout(function () { requestAnimationFrame(loop); }, 60);
    })(0);

    /* ---------- utility controls ---------- */
    $("btnHome").addEventListener("click", toStart);
    $("btnRestart").addEventListener("click", function () {
      if (G.role) startRole(G.role); else toStart();
    });
    $("btnSound").addEventListener("click", function () {
      soundOn = !soundOn;
      this.textContent = soundOn ? "SOUND: ON" : "SOUND: OFF";
      if (soundOn) sfx("tick");
    });
    document.addEventListener("keydown", function (e) {
      if (e.key < "1" || e.key > "4") return;
      var idx = Number(e.key) - 1;
      var btns = elActions.querySelectorAll(".act-btn");
      if (btns[idx] && !btns[idx].disabled) btns[idx].click();
    });

    toStart();
    </script>
  </body>
</html>
