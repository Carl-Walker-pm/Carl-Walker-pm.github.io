<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chair + Teapot — Free Fly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
    canvas { display: block; }

    #blocker {
      position: absolute; inset: 0;
      background: rgba(5, 8, 18, 0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #c8d4ff; font-family: system-ui, sans-serif;
      z-index: 10; cursor: pointer;
    }
    #blocker h1 { font-size: 28px; margin-bottom: 12px; color: #8ab4ff; }
    #blocker p { font-size: 15px; line-height: 1.6; opacity: 0.85; text-align: center; }
    #blocker kbd {
      background: #1a2238; border: 1px solid #3a4a70;
      padding: 2px 7px; border-radius: 4px; font-size: 13px;
    }

    #hud {
      position: absolute; top: 14px; left: 14px;
      color: #7a9acc; font-family: system-ui, sans-serif;
      font-size: 13px; z-index: 5; pointer-events: none;
      text-shadow: 0 0 8px #000;
    }
  </style>
</head>
<body>
  <div id="blocker">
    <h1>Chair + Teapot</h1>
    <p>
      Кликни, чтобы начать свободный полёт<br><br>
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> — движение<br>
      <kbd>Space</kbd> — вверх &nbsp; <kbd>C</kbd> — вниз<br>
      <kbd>Shift</kbd> — быстрее<br>
      Мышь — смотреть вокруг<br>
      <kbd>Esc</kbd> — выйти из режима полёта
    </p>
  </div>

  <div id="hud">Free-fly · Chair ↔ Teapot</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';

    // ---------- Scene ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.012);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 4, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ---------- Lights ----------
    const ambient = new THREE.AmbientLight(0x6688cc, 0.45);
    scene.add(ambient);

    const dir = new THREE.DirectionalLight(0xfff0dd, 1.3);
    dir.position.set(8, 15, 6);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);

    const point = new THREE.PointLight(0x88aaff, 0.6, 40);
    point.position.set(-6, 6, -4);
    scene.add(point);

    // ---------- Floor ----------
    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x12121e,
      roughness: 0.9,
      metalness: 0.1
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // subtle grid
    const grid = new THREE.GridHelper(80, 40, 0x2a2a48, 0x1a1a30);
    grid.position.y = 0.01;
    scene.add(grid);

    // ---------- Chair (made of boxes) ----------
    const chairGroup = new THREE.Group();
    const woodMat = new THREE.MeshStandardMaterial({
      color: 0x8b5a2b,
      roughness: 0.7,
      metalness: 0.05
    });
    const darkWood = new THREE.MeshStandardMaterial({
      color: 0x5c3a1e,
      roughness: 0.75
    });

    // seat
    const seat = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 1.5), woodMat);
    seat.position.y = 1.1;
    seat.castShadow = true;
    chairGroup.add(seat);

    // back
    const back = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.5, 0.12), woodMat);
    back.position.set(0, 1.9, -0.7);
    back.castShadow = true;
    chairGroup.add(back);

    // legs
    const legGeo = new THREE.BoxGeometry(0.12, 1.1, 0.12);
    const legPositions = [
      [-0.65, 0.55, 0.6],
      [ 0.65, 0.55, 0.6],
      [-0.65, 0.55, -0.6],
      [ 0.65, 0.55, -0.6]
    ];
    legPositions.forEach(pos => {
      const leg = new THREE.Mesh(legGeo, darkWood);
      leg.position.set(...pos);
      leg.castShadow = true;
      chairGroup.add(leg);
    });

    // back supports
    const supportGeo = new THREE.BoxGeometry(0.1, 1.3, 0.1);
    [[-0.55, 1.75, -0.7], [0.55, 1.75, -0.7]].forEach(pos => {
      const s = new THREE.Mesh(supportGeo, darkWood);
      s.position.set(...pos);
      s.castShadow = true;
      chairGroup.add(s);
    });

    chairGroup.position.set(-3.5, 0, 0);
    scene.add(chairGroup);

    // ---------- Teapot ----------
    const teapotGeo = new TeapotGeometry(0.9, 12, true, true, true, true, true);
    const teapotMat = new THREE.MeshStandardMaterial({
      color: 0xc0c8d8,
      roughness: 0.25,
      metalness: 0.65
    });
    const teapot = new THREE.Mesh(teapotGeo, teapotMat);
    teapot.position.set(3.2, 1.15, 0.3);
    teapot.castShadow = true;
    teapot.receiveShadow = true;
    scene.add(teapot);

    // small saucer under teapot
    const saucer = new THREE.Mesh(
      new THREE.CylinderGeometry(1.1, 1.1, 0.08, 32),
      new THREE.MeshStandardMaterial({ color: 0xdddde8, roughness: 0.4, metalness: 0.3 })
    );
    saucer.position.set(3.2, 0.7, 0.3);
    saucer.castShadow = true;
    scene.add(saucer);

    // ---------- Thread (line between chair and teapot) ----------
    const threadMat = new THREE.LineBasicMaterial({
      color: 0xaaccff,
      transparent: true,
      opacity: 0.75
    });

    // points roughly from chair back to teapot spout area
    const threadPoints = [
      new THREE.Vector3(-3.5, 2.4, -0.5),   // top of chair back
      new THREE.Vector3(-1.2, 3.1, 0.1),    // mid high
      new THREE.Vector3(1.5, 2.8, 0.2),     // mid
      new THREE.Vector3(3.0, 1.9, 0.4)      // near teapot
    ];
    const threadGeo = new THREE.BufferGeometry().setFromPoints(threadPoints);
    const thread = new THREE.Line(threadGeo, threadMat);
    scene.add(thread);

    // tiny glowing dots on the thread for nicer look
    const dotGeo = new THREE.SphereGeometry(0.04, 8, 8);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0x88ccff });
    threadPoints.forEach(p => {
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.copy(p);
      scene.add(dot);
    });

    // ---------- Controls (Free-fly) ----------
    const controls = new PointerLockControls(camera, document.body);

    const blocker = document.getElementById('blocker');
    blocker.addEventListener('click', () => controls.lock());

    controls.addEventListener('lock', () => {
      blocker.style.display = 'none';
    });
    controls.addEventListener('unlock', () => {
      blocker.style.display = 'flex';
    });

    // Movement state
    const move = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      up: false,
      down: false,
      fast: false
    };

    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();

    document.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': move.forward = true; break;
        case 'KeyS': move.backward = true; break;
        case 'KeyA': move.left = true; break;
        case 'KeyD': move.right = true; break;
        case 'Space': move.up = true; break;
        case 'KeyC': move.down = true; break;
        case 'ShiftLeft':
        case 'ShiftRight': move.fast = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': move.forward = false; break;
        case 'KeyS': move.backward = false; break;
        case 'KeyA': move.left = false; break;
        case 'KeyD': move.right = false; break;
        case 'Space': move.up = false; break;
        case 'KeyC': move.down = false; break;
        case 'ShiftLeft':
        case 'ShiftRight': move.fast = false; break;
      }
    });

    // ---------- Resize ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Animate ----------
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (controls.isLocked) {
        const speed = move.fast ? 18 : 7;

        velocity.x -= velocity.x * 8.0 * delta;
        velocity.z -= velocity.z * 8.0 * delta;
        velocity.y -= velocity.y * 8.0 * delta;

        direction.z = Number(move.forward) - Number(move.backward);
        direction.x = Number(move.right) - Number(move.left);
        direction.y = Number(move.up) - Number(move.down);
        direction.normalize();

        if (move.forward || move.backward) velocity.z -= direction.z * speed * delta * 12;
        if (move.left || move.right)       velocity.x -= direction.x * speed * delta * 12;
        if (move.up || move.down)          velocity.y += direction.y * speed * delta * 10;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
        camera.position.y += velocity.y * delta;

        // soft floor limit
        if (camera.position.y < 0.8) {
          camera.position.y = 0.8;
          velocity.y = 0;
        }
      }

      // gentle floating animation for teapot
      teapot.position.y = 1.15 + Math.sin(time * 0.0015) * 0.06;
      teapot.rotation.y = Math.sin(time * 0.0007) * 0.15;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
