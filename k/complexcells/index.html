  .part .info { flex:1; }

  .pill { background:rgba(4,18,30,.75); border:1px solid rgba(255,255,255,.15);

  #energybar { width:110px; height:10px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; }
  #energyfill { height:100%; width:80%; border-radius:6px;

  .cornerBtn:active { transform:scale(.95); }
  .cornerBtn:disabled { opacity:.4; }
  #divideBtn { background:linear-gradient(90deg,#2dd4bf,#a3e635); }
  #evolveBtn { background:linear-gradient(90deg,#a78bfa,#f0abfc); box-shadow:0 4px 24px rgba(167,139,250,.45); }
  #banner { position:fixed; top:64px; left:0; right:0; z-index:7; text-align:center;
    font-size:20px; font-weight:700; letter-spacing:2px; color:#fde68a;

<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="pill"><span id="lvlTag">LVL 1</span></div>
  <div class="pill" id="energyPill"><span>Energy</span><div id="energybar"><div id="energyfill"></div></div></div>
  <div class="pill hidden" id="hpPill"><span id="hearts"></span></div>
  <div class="pill hidden" id="epPill"><span>🧬</span><span id="epCount">0</span><span>EP</span></div>

</div>

<script>
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
window.addEventListener('resize',resize); resize();

// ---------- audio ----------
let AC=null;
function beep(freq,dur,type){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

// ---------- helpers ----------
function rnd(a,b){ return a+Math.random()*(b-a); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function blob(x,y,r,wob,fill,stroke){
  ctx.beginPath();
  const N=14;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const rr=r*(1+0.07*Math.sin(a*3+wob)+0.05*Math.cos(a*2-wob*1.3));
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); }
}
function drawSnow(){
  for(const s of snow){
    s.y+=s.s*0.016; if(s.y>H){s.y=-4;s.x=Math.random()*W;}
    ctx.globalAlpha=s.o; ctx.fillStyle='#9fd8c2';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}
let bannerTimer=null;
function showBanner(text,ms){
  const b=document.getElementById('banner');
  b.textContent=text; b.style.opacity=1;
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(()=>{ b.style.opacity=0; },ms||2600);
}

// ---------- global state ----------
let level=1;
const G={running:false,paused:false,over:false,t:0,score:0};
const keys={};
let snow=[];
function spawnSnow(){
  snow=[];
  for(let i=0;i<70;i++)snow.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,2.6),s:rnd(4,16),o:rnd(.1,.35)});
}

// ---------- LEVEL 1 ----------
const P={x:0,y:0,r:18,vx:0,vy:0,energy:80,maxEnergy:100,symbionts:0,speed:1,wob:0,tx:0,ty:0};
const MAXSYM=3,WIN_R=30;
let prey=[],mitos=[],preds=[];
function mkPrey(){ return {x:rnd(30,W-30),y:rnd(30,H-30),r:rnd(6,10),vx:rnd(-14,14),vy:rnd(-14,14),wob:rnd(0,6)}; }
function mkMito(){ return {x:rnd(30,W-30),y:rnd(30,H-30),r:rnd(7,9),vx:rnd(-12,12),vy:rnd(-12,12),wob:rnd(0,6)}; }
function mkPred(rmin,rmax,vmax){ const r=rnd(rmin,rmax);
  return {x:rnd(60,W-60),y:rnd(60,H-60),r,vx:rnd(-vmax,vmax),vy:rnd(-vmax,vmax),wob:rnd(0,6),biteCd:0,hp:2}; }

function resetL1(){
  P.x=W/2;P.y=H/2;P.r=18;P.vx=P.vy=0;P.energy=80;
  P.symbionts=0;P.speed=1;P.tx=W/2;P.ty=H/2;
  prey=[];mitos=[];preds=[];
  for(let i=0;i<14;i++)prey.push(mkPrey());
  for(let i=0;i<5;i++)mitos.push(mkMito());
  for(let i=0;i<3;i++)preds.push(mkPred(30,46,22));
}
function stepL1(dt){
  let ax=0,ay=0;
  if(keys['a']||keys['arrowleft'])ax-=1;
  if(keys['d']||keys['arrowright'])ax+=1;
  if(keys['w']||keys['arrowup'])ay-=1;
  if(keys['s']||keys['arrowdown'])ay+=1;
  const sp=165*P.speed;
  if(ax||ay){const n=Math.hypot(ax,ay);P.vx=ax/n*sp;P.vy=ay/n*sp;}
  else{
    const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy);
    if(d>4){P.vx=dx/d*Math.min(sp,d*4);P.vy=dy/d*Math.min(sp,d*4);}
    else{P.vx*=0.9;P.vy*=0.9;}
  }
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  P.x=Math.max(P.r,Math.min(W-P.r,P.x));P.y=Math.max(P.r,Math.min(H-P.r,P.y));
  P.wob+=dt*6;
  const moving=Math.hypot(P.vx,P.vy)>20;
  P.energy-=(moving?2.6:1.0)*dt;
  P.energy+=P.symbionts*0.55*dt;
  P.energy=Math.min(P.maxEnergy,P.energy);
  for(const arr of [prey,mitos,preds])for(const c of arr){
    c.x+=c.vx*dt;c.y+=c.vy*dt;c.wob+=dt*5;
    if(c.x<c.r||c.x>W-c.r)c.vx*=-1;
    if(c.y<c.r||c.y>H-c.r)c.vy*=-1;
    c.x=Math.max(c.r,Math.min(W-c.r,c.x));c.y=Math.max(c.r,Math.min(H-c.r,c.y));
  }
  if(prey.length<14&&Math.random()<dt*1.2)prey.push(mkPrey());
  if(mitos.length<5&&Math.random()<dt*0.5)mitos.push(mkMito());
  if(preds.length<3&&Math.random()<dt*0.15)preds.push(mkPred(30,46,22));
  for(let i=prey.length-1;i>=0;i--){
    const c=prey[i];
    if(dist(P,c)<P.r&&P.r>c.r*1.15){
      prey.splice(i,1);
      P.energy=Math.min(P.maxEnergy,P.energy+12);
      P.r=Math.min(34,P.r+0.55);G.score++;
      beep(440,.1,'triangle');updateHUD();checkWinL1();
    }
  }
  for(let i=mitos.length-1;i>=0;i--){
    const c=mitos[i];
    if(dist(P,c)<P.r&&P.r>c.r*1.15){
      mitos.splice(i,1);
      if(P.symbionts<MAXSYM){
        showChoice('Engulfed a respiring bacterium!',
          "It's alive inside you. Digest it for a burst of energy — or enslave it as a <b>mitochondrion</b>: permanent energy regen and speed.",
          'DIGEST (+30 energy)',()=>{P.energy=Math.min(P.maxEnergy,P.energy+30);beep(300,.15,'triangle');updateHUD();},
          'ENSLAVE (symbiont)',()=>{P.symbionts++;P.speed=1+P.symbionts*0.08;
            beep(520,.2,'sine');setTimeout(()=>beep(780,.25,'sine'),120);updateHUD();checkWinL1();});
      }else{P.energy=Math.min(P.maxEnergy,P.energy+30);beep(300,.12,'triangle');}
      updateHUD();break;
    }
  }
  for(const p of preds){
    if(dist(P,p)<p.r){
      if(p.r>P.r*1.6){endLevel(false,'Engulfed by a larger predator.');return;}
      if(p.r>P.r*1.05){
        P.energy-=34*dt*3;
        const d=Math.max(1,dist(P,p));
        P.x+=(P.x-p.x)/d*260*dt;P.y+=(P.y-p.y)/d*260*dt;
        if(Math.random()<dt*6)beep(140,.12,'sawtooth');
      }
    }
  }
  if(P.energy<=0){P.energy=0;endLevel(false,'Starved in the dark water.');return;}
  updateHUD();
}
function checkWinL1(){
  if(G.over)return;
  if(P.symbionts>=MAXSYM&&P.r>=WIN_R){
    endLevel(true,'EUKARYOTE!','3 mitochondria enslaved · nucleus formed',
      'Your cell just did what no cell had done before: it swallowed another living cell and kept it. Every animal, plant and fungus descends from this moment. But one cell is lonely...',
      [{label:'EVOLVE FURTHER',fn:()=>showIntro(2)},{label:'REPLAY',alt:true,fn:()=>startLevel(1)}]);
  }
}
function drawL1(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#06283a');g.addColorStop(1,'#03141f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawSnow();
  for(const c of prey)blob(c.x,c.y,c.r,c.wob,'rgba(52,211,153,.5)','rgba(52,211,153,.8)');
  for(const c of mitos){
    blob(c.x,c.y,c.r,c.wob,'rgba(251,146,60,.45)','rgba(251,146,60,.9)');
    ctx.fillStyle='#fdba74';ctx.beginPath();ctx.arc(c.x,c.y,c.r*0.35,0,7);ctx.fill();
  }
  for(const c of preds)blob(c.x,c.y,c.r,c.wob,'rgba(248,113,113,.4)','rgba(248,113,113,.85)');
  blob(P.x,P.y,P.r,P.wob,'rgba(163,230,53,.28)','rgba(163,230,53,.95)');
  for(let i=0;i<P.symbionts;i++){
    const a=G.t*1.6+i*(Math.PI*2/MAXSYM);
    ctx.fillStyle='#fb923c';ctx.shadowColor='#fb923c';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(P.x+Math.cos(a)*P.r*0.45,P.y+Math.sin(a)*P.r*0.45,5,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
  if(P.symbionts>=MAXSYM){
    ctx.globalAlpha=.25;ctx.fillStyle='#fde047';
    ctx.beginPath();ctx.arc(P.x,P.y,P.r*0.4,0,7);ctx.fill();ctx.globalAlpha=1;
  }
}

// ---------- LEVEL 2 ----------
const C={cx:0,cy:0,cvx:0,cvy:0,tx:0,ty:0,cells:[],energy:70};
const CELL_R=14,MAXCELLS=8,DIVCOST=35;
let cyano=[];
function maxEnergyL2(){return 60+20*C.cells.length;}
function chloroCount(){return C.cells.filter(c=>c.chloro).length;}
function mkCell(x,y){return {x,y,r:CELL_R,vx:0,vy:0,wob:rnd(0,6),chloro:false};}
function mkCyano(){return {x:rnd(30,W-30),y:rnd(30,H-30),r:rnd(6,8),vx:rnd(-10,10),vy:rnd(-10,10),wob:rnd(0,6)};}
function inLight(c){return c.y<H*0.35;}
function resetL2(){
  C.cx=W/2;C.cy=H*0.6;C.cvx=C.cvy=0;C.tx=W/2;C.ty=H*0.6;
  C.cells=[mkCell(W/2,H*0.6)];C.energy=70;
  prey=[];cyano=[];preds=[];
  for(let i=0;i<16;i++)prey.push(mkPrey());
  for(let i=0;i<6;i++)cyano.push(mkCyano());
  for(let i=0;i<3;i++)preds.push(mkPred(24,38,60));
}
function tryDivide(){
  if(level!==2||G.paused||G.over||!G.running)return;
  if(C.cells.length>=MAXCELLS||C.energy<DIVCOST){beep(180,.12,'sawtooth');return;}
  C.energy-=DIVCOST;
  const a=rnd(0,Math.PI*2);
  C.cells.push(mkCell(C.cx+Math.cos(a)*30,C.cy+Math.sin(a)*30));
  beep(520,.15,'sine');setTimeout(()=>beep(660,.18,'sine'),100);
  updateHUD();checkWinL2();
}
function stepL2(dt){
  let ax=0,ay=0;
  if(keys['a']||keys['arrowleft'])ax-=1;
  if(keys['d']||keys['arrowright'])ax+=1;
  if(keys['w']||keys['arrowup'])ay-=1;
  if(keys['s']||keys['arrowdown'])ay+=1;
  const sp=150;
  if(ax||ay){const n=Math.hypot(ax,ay);C.cvx=ax/n*sp;C.cvy=ay/n*sp;}
  else{
    const dx=C.tx-C.cx,dy=C.ty-C.cy,d=Math.hypot(dx,dy);
    if(d>6){C.cvx=dx/d*Math.min(sp,d*3.5);C.cvy=dy/d*Math.min(sp,d*3.5);}
    else{C.cvx*=0.9;C.cvy*=0.9;}
  }
  C.cx+=C.cvx*dt;C.cy+=C.cvy*dt;
  C.cx=Math.max(40,Math.min(W-40,C.cx));C.cy=Math.max(40,Math.min(H-40,C.cy));
  const n=C.cells.length,ringR=30+n*5;
  C.cells.forEach((cell,i)=>{
    const a=n===1?0:(i/n)*Math.PI*2+G.t*0.15;
    const sx=C.cx+Math.cos(a)*(n===1?0:ringR),sy=C.cy+Math.sin(a)*(n===1?0:ringR);
    const dx=sx-cell.x,dy=sy-cell.y,d=Math.hypot(dx,dy);
    cell.vx=dx*Math.min(6,d*0.12+1.2);cell.vy=dy*Math.min(6,d*0.12+1.2);
    cell.x+=cell.vx*dt;cell.y+=cell.vy*dt;
    cell.x=Math.max(cell.r,Math.min(W-cell.r,cell.x));
    cell.y=Math.max(cell.r,Math.min(H-cell.r,cell.y));
    cell.wob+=dt*6;
    if(cell.chloro&&inLight(cell))C.energy+=0.9*dt;
  });
  const moving=Math.hypot(C.cvx,C.cvy)>20;
  C.energy-=(moving?1.5+0.6*n:0.7+0.3*n)*dt;
  C.energy=Math.min(maxEnergyL2(),C.energy);
  for(const arr of [prey,cyano])for(const c of arr){
    c.x+=c.vx*dt;c.y+=c.vy*dt;c.wob+=dt*5;
    if(c.x<c.r||c.x>W-c.r)c.vx*=-1;
    if(c.y<c.r||c.y>H-c.r)c.vy*=-1;
    c.x=Math.max(c.r,Math.min(W-c.r,c.x));c.y=Math.max(c.r,Math.min(H-c.r,c.y));
  }
  for(const p of preds){
    let best=null,bd=1e9;
    for(const cell of C.cells){const d=dist(p,cell);if(d<bd){bd=d;best=cell;}}
    if(best){const d=Math.max(1,bd);p.vx=(best.x-p.x)/d*55;p.vy=(best.y-p.y)/d*55;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.wob+=dt*5;
    p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));
  }
  if(prey.length<16&&Math.random()<dt*1.4)prey.push(mkPrey());
  if(cyano.length<6&&Math.random()<dt*0.6)cyano.push(mkCyano());
  if(preds.length<3&&Math.random()<dt*0.15)preds.push(mkPred(24,38,60));
  for(let i=prey.length-1;i>=0;i--){
    const c=prey[i];
    for(const cell of C.cells){
      if(dist(cell,c)<cell.r&&cell.r>c.r*1.15){
        prey.splice(i,1);
        C.energy=Math.min(maxEnergyL2(),C.energy+10);G.score++;
        beep(440,.08,'triangle');updateHUD();break;
      }
    }
  }
  for(let i=cyano.length-1;i>=0;i--){
    const c=cyano[i];
    let eater=null;
    for(const cell of C.cells){if(dist(cell,c)<cell.r&&cell.r>c.r*1.15){eater=cell;break;}}
    if(eater){
      cyano.splice(i,1);
      showChoice('Engulfed a cyanobacterium!',
        "It drinks sunlight. Digest it for energy now — or enslave it as a <b>chloroplast</b>: this cell will photosynthesize in the sunlit shallows (top of the screen).",
        'DIGEST (+25 energy)',()=>{C.energy=Math.min(maxEnergyL2(),C.energy+25);beep(300,.15,'triangle');updateHUD();},
        'ENSLAVE (chloroplast)',()=>{eater.chloro=true;
          beep(620,.2,'sine');setTimeout(()=>beep(880,.25,'sine'),120);updateHUD();checkWinL2();});
      updateHUD();break;
    }
  }
  for(const p of preds){
    for(let i=C.cells.length-1;i>=0;i--){
      const cell=C.cells[i];
      if(dist(cell,p)<p.r){
        if(p.r>cell.r*1.9){
          C.cells.splice(i,1);
          beep(160,.25,'sawtooth');updateHUD();
          if(C.cells.length===0){endLevel(false,'The colony was devoured.');return;}
        }else{
          C.energy-=20*dt*3;
          const d=Math.max(1,dist(cell,p));
          cell.x+=(cell.x-p.x)/d*220*dt;cell.y+=(cell.y-p.y)/d*220*dt;
        }
      }
    }
  }
  if(C.energy<=0){C.energy=0;endLevel(false,'The colony starved in the dark.');return;}
  updateHUD();
}
function checkWinL2(){
  if(G.over)return;
  if(C.cells.length>=MAXCELLS&&chloroCount()>=3){
    endLevel(true,'MULTICELLULAR!','8 cells · 3 chloroplasts · one body',
      'Your cells stopped competing and started cooperating — hunters below, solar panels above. This is the ancestor of every mushroom, whale and redwood. But the sea is about to get dangerous...',
      [{label:'EVOLVE FURTHER',fn:()=>showIntro(3)},
       {label:'REPLAY COLONY',alt:true,fn:()=>startLevel(2)},
       {label:'BACK TO LVL 1',alt:true,fn:()=>showIntro(1)}]);
  }
}
function drawL2(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a3a4a');g.addColorStop(0.35,'#07303e');g.addColorStop(1,'#03141f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(120,220,255,.07)';ctx.fillRect(0,0,W,H*0.35);
  ctx.strokeStyle='rgba(150,230,255,.25)';ctx.lineWidth=2;ctx.setLineDash([14,10]);
  ctx.beginPath();ctx.moveTo(0,H*0.35);ctx.lineTo(W,H*0.35);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(150,230,255,.5)';ctx.font='12px sans-serif';
  ctx.fillText('☀ sunlit shallows',14,H*0.35-10);
  drawSnow();
  for(const c of prey)blob(c.x,c.y,c.r,c.wob,'rgba(52,211,153,.5)','rgba(52,211,153,.8)');
  for(const c of cyano){
    blob(c.x,c.y,c.r,c.wob,'rgba(45,212,191,.45)','rgba(45,212,191,.95)');
    ctx.fillStyle='#99f6e4';ctx.beginPath();ctx.arc(c.x,c.y,c.r*0.35,0,7);ctx.fill();
  }
  for(const c of preds)blob(c.x,c.y,c.r,c.wob,'rgba(248,113,113,.4)','rgba(248,113,113,.85)');
  ctx.strokeStyle='rgba(163,230,53,.25)';ctx.lineWidth=3;
  for(let i=0;i<C.cells.length;i++)for(let j=i+1;j<C.cells.length;j++){
    const a=C.cells[i],b=C.cells[j];
    if(dist(a,b)<110){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  }
  for(const cell of C.cells){
    blob(cell.x,cell.y,cell.r,cell.wob,
      cell.chloro?'rgba(45,212,191,.3)':'rgba(163,230,53,.28)',
      cell.chloro?'rgba(45,212,191,.95)':'rgba(163,230,53,.95)');
    ctx.globalAlpha=.3;ctx.fillStyle='#fde047';
    ctx.beginPath();ctx.arc(cell.x,cell.y,cell.r*0.35,0,7);ctx.fill();ctx.globalAlpha=1;
    if(cell.chloro){
      ctx.fillStyle='#2dd4bf';ctx.shadowColor='#2dd4bf';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(cell.x+cell.r*0.3,cell.y-cell.r*0.25,4,0,7);ctx.fill();
      ctx.shadowBlur=0;
    }
  }
}

// ---------- LEVEL 3: Cambrian arms race ----------
const PARTS={
  eyes: {name:'Eyes', desc:'See predators from further in the dark', costs:[10,25,40]},
  armor:{name:'Armor plates', desc:'+1 max health per tier', costs:[10,25,40]},
  fins: {name:'Fins', desc:'+12% swim speed per tier', costs:[10,25,40]},
  jaws: {name:'Jaws', desc:'Eat bigger prey · T2: ram predators · T3: double ram damage', costs:[10,25,40]}
};
const R={x:0,y:0,vx:0,vy:0,r:16,tx:0,ty:0,wob:0,face:0,
  hp:3,maxhp:3,ep:0,tiers:{eyes:0,armor:0,fins:0,jaws:0},
  invuln:0,ramcd:0,gen:1,genT:0};
let boss=null,bossSpawned=false;
function visionR(){ return 140+70*R.tiers.eyes; }
function speedL3(){ return 165*(1+0.12*R.tiers.fins); }
function ramDmg(){ return R.tiers.jaws>=3?2:(R.tiers.jaws>=2?1:0); }
function edibleR(){ return 4+2.5*R.tiers.jaws; }
function mkPlankton(){ return {x:rnd(20,W-20),y:rnd(20,H-20),r:rnd(3,10),vx:rnd(-10,10),vy:rnd(-10,10),wob:rnd(0,6)}; }
function spawnPredEdge(rmin,rmax,spd){
  const r=rnd(rmin,rmax),side=Math.floor(rnd(0,4));
  const p={r,vx:0,vy:0,wob:rnd(0,6),biteCd:0,hp:2,spd};
  if(side===0){p.x=-r;p.y=rnd(0,H);}else if(side===1){p.x=W+r;p.y=rnd(0,H);}
  else if(side===2){p.y=-r;p.x=rnd(0,W);}else{p.y=H+r;p.x=rnd(0,W);}
  const dx=W/2-p.x,dy=H/2-p.y,d=Math.max(1,Math.hypot(dx,dy));
  p.vx=dx/d*spd*0.4;p.vy=dy/d*spd*0.4;
  return p;
}
function resetL3(){
  R.x=W/2;R.y=H/2;R.vx=R.vy=0;R.tx=W/2;R.ty=H/2;R.wob=0;R.face=0;
  R.hp=3;R.maxhp=3;R.ep=0;R.tiers={eyes:0,armor:0,fins:0,jaws:0};
  R.invuln=0;R.ramcd=0;R.gen=1;R.genT=0;
  boss=null;bossSpawned=false;
  prey=[];preds=[];
  for(let i=0;i<18;i++)prey.push(mkPlankton());
  for(let i=0;i<3;i++)preds.push(spawnPredEdge(20,30,95));
}
function buyPart(key){
  const t=R.tiers[key];
  if(t>=3)return;
  const cost=PARTS[key].costs[t];
  if(R.ep<cost){beep(180,.12,'sawtooth');return;}
  R.ep-=cost; R.tiers[key]++;
  if(key==='armor'){R.maxhp++;R.hp++;}
  beep(520,.15,'sine');setTimeout(()=>beep(760,.2,'sine'),110);
  refreshEvolvePanel();updateHUD();
}
function openEvolve(){
  if(level!==3||G.over||!G.running)return;
  G.paused=true;refreshEvolvePanel();
  document.getElementById('evolve').classList.remove('hidden');
  beep(440,.12,'triangle');
}
function closeEvolve(){
  document.getElementById('evolve').classList.add('hidden');
  G.paused=false;
}
function refreshEvolvePanel(){
  document.getElementById('epBig').textContent=R.ep;
  const box=document.getElementById('evolveRows');box.innerHTML='';
  for(const key of Object.keys(PARTS)){
    const def=PARTS[key],t=R.tiers[key];
    const row=document.createElement('div');row.className='part';
    const pips='●'.repeat(t)+'○'.repeat(3-t);
    const btn=t>=3
      ?'<button class="btn small" disabled>MAX</button>'
      :'<button class="btn small" data-part="'+key+'" '+(R.ep<def.costs[t]?'disabled':'')+'>'+def.costs[t]+' EP</button>';
    row.innerHTML='<div class="info"><div class="pname">'+def.name+'</div>'+
      '<div class="pdesc">'+def.desc+'</div><div class="pips">'+pips+'</div></div>'+btn;
    box.appendChild(row);
  }
  box.querySelectorAll('button[data-part]').forEach(b=>{
    b.onclick=()=>buyPart(b.getAttribute('data-part'));
  });
}
function stepL3(dt){
  // movement
  let ax=0,ay=0;
  if(keys['a']||keys['arrowleft'])ax-=1;
  if(keys['d']||keys['arrowright'])ax+=1;
  if(keys['w']||keys['arrowup'])ay-=1;
  if(keys['s']||keys['arrowdown'])ay+=1;
  const sp=speedL3();
  if(ax||ay){const n=Math.hypot(ax,ay);R.vx=ax/n*sp;R.vy=ay/n*sp;}
  else{
    const dx=R.tx-R.x,dy=R.ty-R.y,d=Math.hypot(dx,dy);
    if(d>4){R.vx=dx/d*Math.min(sp,d*4);R.vy=dy/d*Math.min(sp,d*4);}
    else{R.vx*=0.9;R.vy*=0.9;}
  }
  R.x+=R.vx*dt;R.y+=R.vy*dt;
  R.x=Math.max(R.r,Math.min(W-R.r,R.x));R.y=Math.max(R.r,Math.min(H-R.r,R.y));
  R.wob+=dt*6;
  if(Math.hypot(R.vx,R.vy)>30)R.face=Math.atan2(R.vy,R.vx);
  R.invuln=Math.max(0,R.invuln-dt);
  R.ramcd=Math.max(0,R.ramcd-dt);

  // generations — the arms race
  R.genT+=dt;
  if(R.genT>=45){
    R.genT=0;R.gen++;
    showBanner('GENERATION '+R.gen+' — predators evolve');
    beep(220,.3,'sawtooth');
    for(let i=0;i<2;i++)preds.push(spawnPredEdge(20,30,95+R.gen*8));
  }
  if(R.gen>=4&&!bossSpawned){
    bossSpawned=true;
    boss={x:-60,y:H/2,r:46,vx:0,vy:0,wob:0,hp:8,biteCd:0,spd:125};
    showBanner('⚠ ANOMALOCARIS — the first apex predator',4000);
    beep(110,.6,'sawtooth');
  }

  // plankton drift
  for(const c of prey){
    c.x+=c.vx*dt;c.y+=c.vy*dt;c.wob+=dt*5;
    if(c.x<c.r||c.x>W-c.r)c.vx*=-1;
    if(c.y<c.r||c.y>H-c.r)c.vy*=-1;
    c.x=Math.max(c.r,Math.min(W-c.r,c.x));c.y=Math.max(c.r,Math.min(H-c.r,c.y));
  }
  if(prey.length<18&&Math.random()<dt*2)prey.push(mkPlankton());
  if(preds.length<3+R.gen&&Math.random()<dt*0.4)preds.push(spawnPredEdge(20,30,95+R.gen*8));

  // eat plankton
  for(let i=prey.length-1;i>=0;i--){
    const c=prey[i];
    if(dist(R,c)<R.r&&c.r<=edibleR()){
      prey.splice(i,1);
      R.ep+=4;G.score++;
      beep(500,.07,'triangle');updateHUD();
    }
  }

  // predators: chase + bite
  const allFoes=preds.slice();
  if(boss)allFoes.push(boss);
  for(const p of allFoes){
    const isBoss=(p===boss);
    const detect=isBoss?420:260;
    const d=dist(R,p);
    if(d<detect){const dd=Math.max(1,d);p.vx=(R.x-p.x)/dd*p.spd;p.vy=(R.y-p.y)/dd*p.spd;}
    else{p.vx*=0.98;p.vy*=0.98;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.wob+=dt*5;
    p.biteCd=Math.max(0,(p.biteCd||0)-dt);
    // player ram
    const pspd=Math.hypot(R.vx,R.vy);
    if(ramDmg()>0&&R.ramcd<=0&&pspd>110&&d<R.r+p.r){
      p.hp-=ramDmg();R.ramcd=0.8;
      const dd=Math.max(1,d);
      p.vx+=(p.x-R.x)/dd*320;p.vy+=(p.y-R.y)/dd*320;
      beep(700,.12,'square');
      if(p.hp<=0){
        if(isBoss){boss=null;winL3();return;}
        preds.splice(preds.indexOf(p),1);
        R.ep+=20;G.score++;
        showBanner('+20 EP — predator slain');
      }
      updateHUD();continue;
    }
    // foe bite
    if(d<R.r+p.r*0.7&&p.biteCd<=0&&R.invuln<=0){
      R.hp--;R.invuln=1.3;p.biteCd=1.0;
      const dd=Math.max(1,d);
      R.vx+=(R.x-p.x)/dd*300;R.vy+=(R.y-p.y)/dd*300;
      beep(130,.25,'sawtooth');updateHUD();
      if(R.hp<=0){endLevel(false,isBoss?'Slashed by the Anomalocaris.':'Torn apart by predators.');return;}
    }
  }
  updateHUD();
}
function winL3(){
  if(G.over)return;
  endLevel(true,'APEX PREDATOR!','Anomalocaris slain · the Cambrian is yours',
    'Eyes to see, armor to endure, fins to chase, jaws to kill — you out-evolved everything in the sea. But the shallows are getting crowded... something is already crawling toward the shore.',
    [{label:'REPLAY',fn:()=>startLevel(3)},{label:'BACK TO LVL 2',alt:true,fn:()=>showIntro(2)}]);
}
function drawCritter(x,y,r,face,wob,tiers,isBoss){
  ctx.save();ctx.translate(x,y);ctx.rotate(face);
  const body=isBoss?'rgba(190,60,50,.55)':'rgba(45,190,180,.5)';
  const edge=isBoss?'rgba(220,80,60,.95)':'rgba(45,220,200,.95)';
  // body segments
  for(let s=0;s<3;s++){
    const sx=-r*0.5+s*r*0.5;
    ctx.beginPath();ctx.ellipse(sx,0,r*0.62,r*0.5,0,0,7);
    ctx.fillStyle=body;ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
  }
  // armor plates
  ctx.strokeStyle='rgba(230,240,255,.85)';ctx.lineWidth=3;
  for(let i=0;i<tiers.armor;i++){
    ctx.beginPath();ctx.arc(-r*0.3+i*r*0.32,0,r*0.42,-1.2,1.2);ctx.stroke();
  }
  // fins
  ctx.fillStyle=edge;
  for(let i=0;i<tiers.fins;i++){
    const fx=-r*0.3+i*r*0.35;
    ctx.beginPath();ctx.moveTo(fx,-r*0.4);ctx.lineTo(fx+r*0.25,-r*0.85);ctx.lineTo(fx+r*0.15,-r*0.35);ctx.fill();
    ctx.beginPath();ctx.moveTo(fx,r*0.4);ctx.lineTo(fx+r*0.25,r*0.85);ctx.lineTo(fx+r*0.15,r*0.35);ctx.fill();
  }
  // jaws
  if(tiers.jaws>=1){
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(r*0.55,-r*0.25);ctx.quadraticCurveTo(r*1.05,-r*0.15,r*0.95,r*0.05);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*0.55,r*0.25);ctx.quadraticCurveTo(r*1.05,r*0.15,r*0.95,-r*0.05);ctx.stroke();
  }
  // boss frontal appendages
  if(isBoss){
    ctx.strokeStyle='rgba(255,150,120,.9)';ctx.lineWidth=4;
    for(const s of [-1,1]){
      ctx.beginPath();ctx.moveTo(r*0.6,s*r*0.3);
      ctx.quadraticCurveTo(r*1.3,s*r*0.5+Math.sin(wob*2)*4,r*1.5,s*r*0.1);ctx.stroke();
    }
  }
  // eyes
  const esz=2.5+tiers.eyes*1.2;
  for(const s of [-1,1]){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*0.35,s*r*0.22,esz,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(r*0.42,s*r*0.22,esz*0.45,0,7);ctx.fill();
  }
  ctx.restore();
}
function drawL3(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b2f3f');g.addColorStop(1,'#041019');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawSnow();
  for(const c of prey)blob(c.x,c.y,c.r,c.wob,'rgba(120,230,160,.5)','rgba(120,230,160,.7)');
  const vr=visionR();
  for(const p of preds){
    if(dist(R,p)>vr)continue;
    blob(p.x,p.y,p.r,p.wob,'rgba(248,113,113,.45)','rgba(248,113,113,.9)');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x+p.r*0.3,p.y-p.r*0.2,3,0,7);ctx.fill();
    ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(p.x+p.r*0.32,p.y-p.r*0.2,1.5,0,7);ctx.fill();
  }
  if(boss&&dist(R,boss)<vr+60)drawCritter(boss.x,boss.y,boss.r,Math.atan2(boss.vy,boss.vx)||0,boss.wob,{eyes:3,armor:3,fins:0,jaws:3},true);
  // player (blink while invulnerable)
  if(R.invuln<=0||Math.floor(G.t*10)%2===0)
    drawCritter(R.x,R.y,R.r,R.face,R.wob,R.tiers,false);
  // darkness outside vision
  const vg=ctx.createRadialGradient(R.x,R.y,vr*0.25,R.x,R.y,vr);
  vg.addColorStop(0,'rgba(2,8,16,0)');
  vg.addColorStop(1,'rgba(2,8,16,0.93)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function updateHUD(){
  const inL3=level===3,inL2=level===2,inL1=level===1;
  document.getElementById('energyPill').classList.toggle('hidden',!inL1&&!inL2);
  document.getElementById('hpPill').classList.toggle('hidden',!inL3);
  document.getElementById('epPill').classList.toggle('hidden',!inL3);
  if(inL1||inL2){
    const e=inL1?P.energy:C.energy,m=inL1?P.maxEnergy:maxEnergyL2();
    energyfill.style.width=Math.max(0,e/m*100)+'%';
    energyfill.style.background=e<m*0.25
      ?'linear-gradient(90deg,#f87171,#fb923c)':'linear-gradient(90deg,#34d399,#a3e635)';
  }
  if(inL3){
    heartsEl.textContent='❤️'.repeat(Math.max(0,R.hp))+'🖤'.repeat(Math.max(0,R.maxhp-R.hp));
    epCount.textContent=R.ep;
  }
  lvlTag.textContent=inL1?'LVL 1 · ONE CELL':inL2?'LVL 2 · COLONY':'LVL 3 · CAMBRIAN';
  let dots='';
  if(inL1){for(let i=0;i<MAXSYM;i++)dots+='<span class="dot mito'+(i<P.symbionts?'':' empty')+'"></span>';}
  else if(inL2){for(const cell of C.cells)dots+='<span class="dot'+(cell.chloro?' chloro':' empty')+'"></span>';}
  else{const t=R.tiers;dots='<span style="font-size:12px">👁'+t.eyes+' 🛡'+t.armor+' 🐟'+t.fins+' 🦷'+t.jaws+'</span>';}
  sympill.innerHTML=dots;
  scoreEl.textContent=(inL3?'Kills ':'Prey ')+G.score;
  divideBtn.classList.toggle('hidden',!inL2);
  evolveBtn.classList.toggle('hidden',!inL3);
  if(inL2)divideBtn.disabled=C.energy<DIVCOST||C.cells.length>=MAXCELLS;
}

function endLevel(win,title,sub,text,buttons){
  G.over=true;G.running=false;
  closeEvolve();
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endSub').textContent=sub||'';
  document.getElementById('endText').textContent=text;
  const box=document.getElementById('endBtns');box.innerHTML='';

    const btn=document.createElement('button');
    btn.className='btn'+(b.alt?' alt':'');btn.textContent=b.label;
    btn.onclick=()=>{document.getElementById('end').classList.add('hidden');b.fn();};
    box.appendChild(btn);
  });
  document.getElementById('end').classList.remove('hidden');
  beep(win?660:160,.5,win?'sine':'sawtooth');
}

  2:{title:'COMPLEX CELLS',sub:'Level 2 · ~1.5 billion years ago · the colony',
    body:'Your eukaryote learned a new trick: <b>division</b>. You are now a colony — every cell follows your lead. <b>Divide</b> (button or space) to grow to 8 cells. Engulf teal <b>cyanobacteria</b> and enslave them as <b>chloroplasts</b> — those cells will photosynthesize in the sunlit shallows. Win: <b>8 cells with 3+ chloroplasts</b> — one body, many cells.',
    keys:'Move: mouse / touch / WASD / arrows · Divide: button or SPACE · Chloroplast cells charge in the light zone (top) · Beware hunters'},
  3:{title:'COMPLEX CELLS',sub:'Level 3 · 541 million years ago · the Cambrian Explosion',
    body:'The sea just got eyes. You are a soft-bodied swimmer in the first arms race in history. Eat plankton to earn <b>evolution points</b>, spend them on <b>eyes, armor, fins and jaws</b> — while predators evolve generation after generation. At generation 4, the <b>Anomalocaris</b> arrives. Kill it. Become the apex.',
    keys:'Move: mouse / touch / WASD / arrows · EVOLVE: button or SPACE · Jaws T2+: ram predators to kill them · No hunger here — only teeth'}
};
function showIntro(lv){
  level=lv;
  const I=INTROS[lv];
  document.getElementById('introTitle').textContent=I.title;
  document.getElementById('introSub').textContent=I.sub;
  document.getElementById('introBody').innerHTML=I.body;
  document.getElementById('introKeys').textContent=I.keys;
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
}
function startLevel(lv){
  level=lv;G.score=0;G.t=0;G.over=false;G.paused=false;
  if(lv===1)resetL1();else if(lv===2)resetL2();else resetL3();
  spawnSnow();
  closeEvolve();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  updateHUD();
  if(lv===3)showBanner('CAMBRIAN EXPLOSION — generation 1');
  G.running=true;last=performance.now();
  requestAnimationFrame(loop);
}

// ---------- input ----------
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(k===' '){
    e.preventDefault();
    if(level===2)tryDivide();
    else if(level===3){
      document.getElementById('evolve').classList.contains('hidden')?openEvolve():closeEvolve();
    }
  }
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function pointTo(x,y){
  if(level===1){P.tx=x;P.ty=y;}
  else if(level===2){C.tx=x;C.ty=y;}
  else{R.tx=x;R.ty=y;}
}
canvas.addEventListener('mousemove',e=>pointTo(e.clientX,e.clientY));
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];pointTo(t.clientX,t.clientY);},{passive:true});
canvas.addEventListener('touchmove',e=>{const t=e.touches[0];pointTo(t.clientX,t.clientY);e.preventDefault();},{passive:false});
divideBtn.addEventListener('click',tryDivide);
evolveBtn.addEventListener('click',openEvolve);
document.getElementById('evolveClose').onclick=closeEvolve;

// ---------- loop ----------
let last=0;
function loop(ts){
  if(!G.running)return;
  const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  if(!G.paused&&!G.over){
    G.t+=dt;
    if(level===1)stepL1(dt);else if(level===2)stepL2(dt);else stepL3(dt);
  }
  if(level===1)drawL1();else if(level===2)drawL2();else drawL3();
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=()=>{
  beep(440,.15,'sine');
  startLevel(level);
};
showIntro(1);
spawnSnow();
</script>
</body>
</html>
