<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dragon Trail — a turn-based RPG | No script, born in real time</title>
<meta name="description" content="A fullscreen turn-based dragon RPG for your phone. No scripted roster: every dragon is generated the moment you meet it. Battle, bond, collect.">
<style>
  :root{--bg:#0d0a14;--panel:#171226;--panel2:#1f1836;--ink:#ece7ff;--dim:#9d92c4;--acc:#e0a458;--good:#7be3a8;--bad:#ff8f8f;--line:#332a55}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Verdana,sans-serif;display:flex;justify-content:center}
  #app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;padding:10px 10px 12px;gap:8px}
  header{display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:15px;font-weight:normal;letter-spacing:3px;text-transform:uppercase;color:var(--acc)}
  #place{font-size:11.5px;color:var(--dim);letter-spacing:1px}
  #team{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--dim)}
  .chip b{color:var(--ink);font-weight:normal}
  .chip.active{border-color:var(--acc);color:var(--ink)}
  #scene{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px 6px;flex:0 0 auto}
  #sceneImg{width:100%;height:37dvh;object-fit:cover;border-radius:8px;display:block;background:#0d0a14}
  .el-Fire{color:#ffb27b}.el-Water{color:#8fd0ff}.el-Storm{color:#e9e37b}.el-Stone{color:#cbb99a}.el-Leaf{color:#9fe8a9}.el-Frost{color:#c8f4ff}
  .bar{font-family:"Courier New",monospace;font-size:11.5px;color:var(--dim);text-align:left;margin-top:4px;white-space:pre-wrap;word-break:break-word}
  .bar b{color:var(--ink);font-weight:normal}
  #log{flex:1 1 auto;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55}
  #log p{margin-bottom:6px}
  #log .sys{color:var(--dim)} #log .win{color:var(--good)} #log .hit{color:var(--bad)} #log .gold{color:var(--acc)}
  #actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto}
  #actions button{font-family:Verdana,sans-serif;font-size:15px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px 8px;cursor:pointer;min-height:58px}
  #actions button:active{background:#2c2350;transform:translateY(1px)}
  #actions button:disabled{opacity:.35}
  #actions button.primary{border-color:var(--acc);color:var(--acc)}
  .foot{text-align:center;color:#55497e;font-size:10.5px}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C2W27FWRBQ"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C2W27FWRBQ');</script>

    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yy98c80d84");
</script>
</head>
<body>
<div id="app">
  <header><h1>🐉 Dragon Trail</h1><span id="place">THE ASHEN FIELDS</span></header>
  <div id="team"></div>
  <div id="scene">
    <img id="sceneImg" alt="On the Dragon Trail" src="img/trail.jpg">
    <div class="bar" id="enemyBar"></div>
    <div class="bar" id="allyBar"></div>
  </div>
  <div id="log"></div>
  <div id="actions"></div>
  <div class="foot">No script — every dragon is born the moment you meet it · a museum piece that plays back</div>
</div>
<script>
(function(){
"use strict";
// ---------- utilities ----------
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// ---------- the un-written roster: generation, not script ----------
var ELEMENTS=['Fire','Water','Storm','Stone','Leaf','Frost'];
var BEATS={Fire:'Leaf',Leaf:'Stone',Stone:'Storm',Storm:'Water',Water:'Fire',Frost:'Storm'};
var NAME_A=['Ash','Vor','Ka','Zeph','Mor','Thal','Ign','Rhu','Sel','Ost','Dra','Fen','Gal','Hur','Mist','Pyrr'];
var NAME_B=['agon','ith','ex','ora','une','askar','ion','ek','oth','ara','ix','ume'];
var MOVES={
  Fire:['Ember Bite','Flame Wing'], Water:['Tide Slam','Mist Lash'],
  Storm:['Volt Fang','Gale Rush'], Stone:['Rock Horn','Dust Maul'],
  Leaf:['Thorn Coil','Petal Saw'], Frost:['Ice Shard','Rime Breath']
};
var HORNS=['\\/  \\/','^^  ^^','||  ||','\\\\  //','Y    Y','/\\  /\\'];
var EYES=['o  o','>  <','*  *','@  @','-  -'];
var WINGS=['/\\/\\','/~~\\','/==\\','/^^\\','/||\\','/xx\\'];
var BELLY=['::::::::::::::::','~~~~~~~~~~~~~~~~','================','................','::::::::::::::::'];
var TAILS=['~~~~~~~~~','>>>>>>>','∿∿∿∿∿∿∿','---------','~~~~~~~~~'];

function genDragon(level){
  var el=pick(ELEMENTS);
  var name=pick(NAME_A)+pick(NAME_B);
  var d={
    name:name, el:el, level:level,
    img:'img/'+el.toLowerCase()+'-'+(1+rnd(2))+'.jpg',
    maxhp:0, hp:0, atk:0, def:0, spd:0, xp:0, xpNext:20,
    art:{
      horns:pick(HORNS), eyes:pick(EYES), wing:pick(WINGS),
      belly:pick(BELLY), tail:pick(TAILS)
    },
    guard:0
  };
  scaleStats(d,true);
  return d;
}
function scaleStats(d,full){
  var base=18+d.level*6;
  d.maxhp=base+rnd(8);
  d.atk=6+d.level*2+rnd(3);
  d.def=4+d.level*2+rnd(3);
  d.spd=4+d.level+rnd(6);
  if(full) d.hp=d.maxhp;
}
function artOf(d){
  var a=d.art;
  return [
  '            '+a.horns,
  '           /  '+a.eyes+'  \\',
  '     '+a.wing+'  (  \\__/  )  '+a.wing,
  '    <   '+a.belly+'   >',
  '     \\____/  |  |  \\____/ '+a.tail,
  '          __/    \\__',
  '         (___/  \\___)'
  ].join('\n');
}
function idleArt(){
  return [
  '                                        ',
  '              ~  ~   ~                  ',
  '        ~   The trail winds on     ~    ',
  '     ~                                  ',
  '          .-=========-._                ',
  '       .-\'  ash fields   \'-.            ',
  '      /   wild dragons roam  \\          ',
  '      \\      .  *   .       /           ',
  '       \'-.______________.-\'             ',
  '                                        '
  ].join('\n');
}

// ---------- game state ----------
var team=[], active=0, enemy=null, mode='explore', crystals=3, steps=0, started=false;
var logEl=document.getElementById('log'), sceneImg=document.getElementById('sceneImg'),
    enemyBar=document.getElementById('enemyBar'), allyBar=document.getElementById('allyBar'),
    actionsEl=document.getElementById('actions'), teamEl=document.getElementById('team'),
    placeEl=document.getElementById('place');
var PLACES=['THE ASHEN FIELDS','THE GLASS MARSH','THE HOWLING REACH','THE EMBER COAST','THE FROSTSPIRE FOOTHILLS','THE VERDANT HOLLOW'];

function say(text,cls){
  var p=document.createElement('p'); if(cls)p.className=cls; p.innerHTML=text;
  logEl.appendChild(p); logEl.scrollTop=logEl.scrollHeight;
}
function hpBar(d){
  var n=16, filled=clamp(Math.round(d.hp/d.maxhp*n),0,n), s='';
  for(var i=0;i<n;i++) s+= i<filled?'█':'░';
  return s+' '+Math.max(0,d.hp)+'/'+d.maxhp;
}
function render(){
  var ally=team[active];
  teamEl.innerHTML=team.map(function(d,i){
    return '<span class="chip'+(i===active?' active':'')+'">'+(i===active?'▶ ':'')+'<b>'+d.name+'</b> '+d.el+' Lv'+d.level+' · '+Math.max(0,d.hp)+'/'+d.maxhp+'</span>';
  }).join('')+'<span class="chip">◆ crystals: <b>'+crystals+'</b></span>';
  if(enemy){
    sceneImg.src=enemy.img;
    enemyBar.innerHTML='WILD <b>'+enemy.name+'</b> · '+enemy.el+' · Lv '+enemy.level+'\n'+hpBar(enemy);
  }else{
    sceneImg.src=started?team[active].img:'img/trail.jpg';
    enemyBar.textContent= started? team[active].name+' walks beside you.' : 'No wild dragon in sight.';
  }
  allyBar.innerHTML='YOURS <b>'+ally.name+'</b> · '+ally.el+' · Lv '+ally.level+' · XP '+ally.xp+'/'+ally.xpNext+'\n'+hpBar(ally);
  renderActions();
}
function btn(label,fn,primary,disabled){
  var b=document.createElement('button'); b.textContent=label;
  if(primary)b.className='primary'; if(disabled)b.disabled=true;
  b.addEventListener('click',fn); return b;
}
function renderActions(){
  actionsEl.innerHTML='';
  if(mode==='explore'){
    actionsEl.appendChild(btn('🔍 Search the trail',doSearch,true));
    actionsEl.appendChild(btn('⛺ Camp & heal',doCamp));
    actionsEl.appendChild(btn('🐉 Switch dragon',doSwitch, false, team.length<2));
    actionsEl.appendChild(btn('◆ Buy crystal (free at camp)',function(){ say('The camp keeper smiles: "Crystals are free for trail-walkers." +1 ◆','sys'); crystals++; render(); }));
  }else{
    actionsEl.appendChild(btn('⚔️ Strike',function(){doMove('strike');},true));
    actionsEl.appendChild(btn('✨ '+MOVES[team[active].el][rnd(2)]+' (element)',function(){doMove('blast');}));
    actionsEl.appendChild(btn('◆ Bond crystal ('+crystals+')',doCatch,false,crystals<=0));
    actionsEl.appendChild(btn('🏃 Flee',doFlee));
  }
}
function foeStrike(){
  var foe=enemy, ally=team[active];
  if(foe.hp<=0) return;
  var power=foe.atk*(0.85+Math.random()*0.3);
  var dmg=Math.max(1,Math.round(power-ally.def*0.45));
  ally.hp-=dmg;
  say('<b>'+foe.name+'</b> strikes back — '+dmg+' damage to '+ally.name+'.','hit');
  if(ally.hp<=0){ ally.hp=0; defeat(); }
}
function endTurn(){
  if(enemy && enemy.hp>0 && team[active].hp>0){ foeStrike(); }
  render();
}
function effMult(attEl,defEl){
  if(BEATS[attEl]===defEl) return 1.5;
  if(BEATS[defEl]===attEl) return 0.65;
  return 1.0;
}
function doMove(kind){
  var ally=team[active], foe=enemy; if(!foe||ally.hp<=0) return;
  var mult=effMult(ally.el,foe.el), base, label;
  if(kind==='strike'){ base=ally.atk; label='Strike'; }
  else{ base=ally.atk*1.45; label='element blast'; if(Math.random()<0.15){ say(ally.name+'’s '+label+' missed!','sys'); endTurn(); return; } }
  var dmg=Math.max(1,Math.round(base*mult*(0.85+Math.random()*0.3)-foe.def*0.45));
  foe.hp-=dmg;
  say('<b>'+ally.name+'</b> uses '+label+' — '+dmg+' damage'+(mult>1?' (super effective!)':mult<1?' (resisted)':'')+'.', dmg>14?'gold':'');
  if(foe.hp<=0){ victory(); return; }
  endTurn();
}
function doCatch(){
  var ally=team[active], foe=enemy; if(!foe||crystals<=0) return;
  crystals--;
  var missing=1-foe.hp/foe.maxhp;
  var chance=0.25+missing*0.6+(foe.level<ally.level?0.1:0);
  say('You throw a ◆ bond crystal at <b>'+foe.name+'</b>… it wobbles…','sys');
  if(Math.random()<chance){
    say('<b>'+foe.name+'</b> is bonded! It joins your trail. 🐉','win');
    team.push(foe); enemy=null; mode='explore'; render();
  }else{
    say(foe.name+' breaks free!','hit'); endTurn();
  }
}
function doFlee(){
  if(Math.random()<0.7){ say('You slip away into the ash grass.','sys'); enemy=null; mode='explore'; render(); }
  else{ say('No escape — '+enemy.name+' cuts you off!','hit'); endTurn(); }
}
function victory(){
  var ally=team[active], gain=8+enemy.level*4;
  say('<b>'+enemy.name+'</b> is defeated. +'+gain+' XP.','win');
  ally.xp+=gain;
  while(ally.xp>=ally.xpNext){
    ally.xp-=ally.xpNext; ally.level++; ally.xpNext=Math.round(ally.xpNext*1.5);
    scaleStats(ally,false); ally.hp=Math.min(ally.maxhp,ally.hp+Math.round(ally.maxhp*0.4));
    say('🌟 <b>'+ally.name+'</b> grows to level '+ally.level+'!','gold');
  }
  enemy=null; mode='explore'; render();
}
function defeat(){
  var ally=team[active];
  say('<b>'+ally.name+'</b> falls. The trail carries you both back to camp…','hit');
  var next=team.findIndex(function(d){return d.hp>0;});
  if(next>=0){ active=next; say(team[active].name+' steps forward.','sys'); }
  else{ team.forEach(function(d){ d.hp=d.maxhp; }); say('At camp, your dragons are fully healed.','sys'); }
  enemy=null; mode='explore'; render();
}
function doSearch(){
  started=true; steps++;
  if(steps%4===0) placeEl.textContent=pick(PLACES);
  var lvl=clamp(team[active].level+rnd(3)-1,1,99);
  enemy=genDragon(lvl); mode='battle';
  say('A wild <b>'+enemy.name+'</b> appears — '+enemy.el+' dragon, level '+enemy.level+'!','gold');
  render();
}
function doCamp(){
  started=true;
  team.forEach(function(d){ d.hp=d.maxhp; });
  crystals=Math.max(crystals,3);
  say('You camp under the ash trees. Everyone is healed; crystals restocked to at least 3.','sys');
  render();
}
function doSwitch(){
  var alive=team.map(function(d,i){return i;}).filter(function(i){return i!==active;});
  if(!alive.length) return;
  active=alive[0];
  say(team[active].name+' takes the lead.','sys');
  render();
}

// ---------- opening ----------
var starter=genDragon(2); team.push(starter);
say('Welcome to the <b>Dragon Trail</b>, walker.','gold');
say('There is no script here and no fixed roster of dragons — every dragon in this world is generated the moment you meet it: its name, its element, its horns, its temper.');
say('Your first companion bonds with you: <b>'+starter.name+'</b>, a '+starter.el+' dragon, level '+starter.level+'.');
say('Search the trail. Weaken a wild dragon, then throw a ◆ bond crystal to make it yours. Camp to heal. That is the whole law of the trail.');
render();
})();
</script>
</body>
</html>
