var AUTHORED = {
'x1y1': {
  'title': { html:'<p><b>The Ten Crossings</b></p><p>The Stone Country does not hate you. It simply obeys its laws: what falls, falls; what balances, stands; what is pushed, answers with its weight.</p><p>You are a runner. The Far Gate is ten crossings away, and every crossing is a question asked by stone — of timing, balance, and nerve — answered by your body.</p><p class="dim">This game was authored from its name. Only this screen and its branches exist; it grows one step ahead of you.</p><p>Choose the length of the journey:</p>',
    choices:[ { label:'🐾 The Ten Crossings — 10 steps', hint:'Authored journey', len:10 }, { label:'🌿 A journey — 30 steps', hint:'Not yet written', disabled:true }, { label:'🏔️ A long journey — 50 steps', hint:'Not yet written', disabled:true } ] },
  'arr-10': { html:'<p>Dawn. Across the path, the first stones of the country lie like a held breath. Far ahead — further than sight — the Far Gate.</p><p>You roll your shoulders, feel the ground through your soles, and step forward.</p><p class="dim">Movement × Rigid Physics · 10 steps</p>', choices:[ { label:'▶ Step forward' } ] },
  's1': { img:'act', html:'<p><b>The Slope of Loose Stone.</b> A scree slope, forty paces wide, every stone awake and waiting for an excuse. High up, the stones lie packed and old. Low down, the way is short — and moving.</p>', choices:[ { label:'⬆️ Cross high, where the stones are packed' }, { label:'⬇️ Cross low and fast, before they slide' } ] },
  'o1a': { img:'act', eff:{insight:1}, html:'<p>Packed stone holds. Step by deliberate step you read the slope with your feet, and it lets you pass like a senior letting a junior by.</p><p class="dim">✦ First lesson of the country: old stone keeps its word.</p>', choices:[ { label:'▶ Continue' } ] },
  'o1b': { img:'act', html:'<p>You run the low line and the whole slope sighs downhill behind you — a river of stone, loud as applause. Across. Heart hammering. Nothing broken.</p>', choices:[ { label:'▶ Continue' } ] },
  's2': { img:'act', html:'<p><b>The Ledge.</b> One foot wide, polished by wind, with honest air below it. The ledge does not narrow and does not widen. It simply is.</p>', choices:[ { label:'🚶 Walk it — arms out, eyes on the far side' }, { label:'🧎 Sit, and scoot along it' } ] },
  'o2a': { img:'act', eff:{insight:1}, html:'<p>Eyes on the far side, and the body follows the gaze, the way it always does. Your feet find their own counsel. Halfway across you are almost calm.</p><p class="dim">✦ The country teaches: look where you are going, not where you fear.</p>', choices:[ { label:'▶ Continue' } ] },
  'o2b': { img:'act', html:'<p>Seated, you inch along with great dignity and no style at all. Below, a dislodged pebble takes the fast way down, pinging off the rock. You do not watch it land.</p>', choices:[ { label:'▶ Continue' } ] },
  's3': { img:'act', html:'<p><b>The Rain of Pebbles.</b> The cliff above sheds its skin in small stones — patter, pause, patter. There is a rhythm to it, if you stand still long enough to learn it.</p>', choices:[ { label:'⏱️ Learn the rhythm, sprint the gaps' }, { label:'🧱 Hug the cliff wall and inch through' } ] },
  'o3a': { img:'act', eff:{insight:1}, html:'<p>Patter — you wait. Pause — you run. Patter — you freeze mid-stride like a statue of yourself. Three gaps, three sprints, and you are through with nothing worse than dust in your hair.</p><p class="dim">✦ Timing is a kind of strength.</p>', choices:[ { label:'▶ Continue' } ] },
  'o3b': { img:'act', html:'<p>Flat against the wall, you shuffle through the cliff\'s own shadow, where the pebbles rarely reach. Slow. A small stone kisses your shoulder — a reminder, not an injury.</p>', choices:[ { label:'▶ Continue' } ] },
  's4': { img:'act', html:'<p><b>The Boulder.</b> It sits in the narrow of the path like a full stop. Too round to climb quickly, too heavy to argue with — almost. Between boulder and wall: a gap the width of your ribs.</p>', choices:[ { label:'💪 Shoulder it — shift it by weight' }, { label:'↔️ Squeeze through the gap' } ] },
  'o4a': { img:'act', eff:{insight:1}, html:'<p>You set your shoulder, breathe out, and lean your whole life into it. The boulder considers — and rolls, one hand\'s width. Enough. Stone respects weight honestly given.</p><p class="dim">✦ You do not have to move the mountain. A hand\'s width is a door.</p>', choices:[ { label:'▶ Continue' } ] },
  'o4b': { img:'act', html:'<p>Sideways. Breath held thin. The stone is cold through your shirt, front and back, and for three steps you and the boulder are one object. Then — pop — you are through.</p>', choices:[ { label:'▶ Continue' } ] },
  's5': { img:'act', html:'<p><b>The Stone Bridge.</b> A natural arch over a gorge, older than any road — with a crack across its middle like a held-back word. The crack is the whole question.</p>', choices:[ { label:'🏃 Cross at a run — little time on the crack' }, { label:'🐾 Cross on all fours, weight spread wide' } ] },
  'o5a': { img:'act', html:'<p>You take it at a run — six strides, the crack under your feet for one heartbeat each. The arch hums through your soles and holds, the way it has held for ten thousand crossings.</p>', choices:[ { label:'▶ Continue' } ] },
  'o5b': { img:'act', eff:{insight:1}, html:'<p>Hands and feet, weight spread over four points, you pour yourself across the crack like water. Under your palm the stone feels almost warm. The arch approves of being understood.</p><p class="dim">✦ Spread the load, and even cracked things carry you.</p>', choices:[ { label:'▶ Continue' } ] },
  's6': { img:'act', html:'<p><b>The Falling Stair.</b> The path drops in giant steps, each one a tilted slab that rocks a finger\'s width when tested. Below them, the country continues — if you arrive in one piece.</p>', choices:[ { label:'🦘 Jump step to step, trust momentum' }, { label:'⬇️ Lower yourself down each one' } ] },
  'o6a': { img:'act', eff:{insight:1}, html:'<p>Step — rock — leap. Step — rock — leap. Momentum carries you over the doubt, and the stair clatters its applause behind you, one slab at a time.</p><p class="dim">✦ Sometimes balance is just falling, aimed.</p>', choices:[ { label:'▶ Continue' } ] },
  'o6b': { img:'act', html:'<p>Down on your belly for each drop, feet first, finding the next slab by toe. Undignified. Methodical. The country respects method too — it lets you down gently, step by step.</p>', choices:[ { label:'▶ Continue' } ] },
  's7': { img:'act', html:'<p><b>The Column.</b> A fallen pillar of stone lies across a ravine — round as a tree trunk, smooth as ice in its middle where the wind has polished it for a century.</p>', choices:[ { label:'🚶 Walk the round top, steady and upright' }, { label:'🫂 Bear-hug it and shinny across' } ] },
  'o7a': { img:'act', eff:{insight:1}, html:'<p>Halfway across, the polished middle tries to roll your feet off the world. You soften your knees, breathe, and walk out of the wobble. The ravine below keeps its opinion to itself.</p><p class="dim">✦ Soft knees, soft landing.</p>', choices:[ { label:'▶ Continue' } ] },
  'o7b': { img:'act', html:'<p>Arms and legs wrapped around cold stone, you progress by hugs. It is slow, it is ridiculous, and it has worked since the first creature crossed anything. The column does not laugh. Stone is polite.</p>', choices:[ { label:'▶ Continue' } ] },
  's8': { img:'act', html:'<p><b>The Hail.</b> Above the open stretch, a loose face of the mountain lets go in bursts — a clatter of stone, a silence, a clatter. An overhang offers its shelter nearby.</p>', choices:[ { label:'🛡️ Shelter under the overhang, wait it out' }, { label:'💨 Run the open stretch between bursts' } ] },
  'o8a': { img:'act', html:'<p>Under the overhang you watch the mountain throw its tantrum — burst, burst, then a longer silence that feels different in the bones. You step out into a clean, quiet world smelling of struck stone.</p>', choices:[ { label:'▶ Continue' } ] },
  'o8b': { img:'act', eff:{insight:1}, html:'<p>Silence — GO. Stones begin to mutter behind you as your feet find the far edge; the burst breaks over the empty ground you just left. The country applauds in its own language.</p><p class="dim">✦ Read the pause, not the noise.</p>', choices:[ { label:'▶ Continue' } ] },
  's9': { img:'act', html:'<p><b>The Great Weight.</b> A stone door blocks the last approach, hung from a rope over a beam, the rope\'s other end tied to a hanging rock — a counterweight, waiting for an argument. A fallen beam lies nearby.</p>', choices:[ { label:'⚖️ Add your weight to the rope' }, { label:'🪵 Wedge the door with the fallen beam' } ] },
  'o9a': { img:'act', eff:{insight:1}, html:'<p>You climb the rope and hang. Your weight plus the rock\'s weight, against the door — arithmetic the country cannot refuse. The slab rises, groaning, exactly as high as honesty requires.</p><p class="dim">✦ In this country, you are also a weight. Spend yourself well.</p>', choices:[ { label:'▶ Continue' } ] },
  'o9b': { img:'act', html:'<p>Lever, heave, wedge — the beam takes the door\'s grudge and holds it, creaking. You slip under with respect for both parties. Behind you, the beam settles in for a long career.</p>', choices:[ { label:'▶ Continue' } ] },
  's10': { img:'act', html:'<p><b>The Far Gate.</b> It is not locked. It is simply a slab of stone taller than you, hung true on stone pivots, and it opens for whatever can move it honestly. The country beyond is already visible through the seam — light, and open ground.</p>', choices:[ { label:'✋ Push — whole body, slow and steady' }, { label:'🎵 Rock it — swing the slab by rhythm' } ] },
  'o10a': { img:'act', eff:{insight:1}, html:'<p>Palm, shoulder, hip, leg — you become a slow lever of yourself. The pivot grinds, considers, and yields a hand\'s width, a forearm, a doorway. Light comes through like water.</p><p class="dim">✦ Steady pressure outlasts force.</p>', choices:[ { label:'▶ Continue' } ] },
  'o10b': { img:'act', eff:{insight:1}, html:'<p>Push — release. Push — release. The great slab begins to swing to your rhythm, a hand\'s width wider with every pass, until the doorway stands open and still, breathing with you.</p><p class="dim">✦ Even stone keeps time, once you find it.</p>', choices:[ { label:'▶ Continue' } ] },
  'finale': { img:'finale', html:'<p><b>The Far Gate stands open.</b></p><p>Ten crossings: {{steps}} answers given with one body. ✦ Lessons the country taught you: {{insights}}.</p><p>The Stone Country never opposed you. It only ever asked its questions honestly — what falls, falls; what balances, stands — and you answered every one.</p><p class="dim">Movement × Rigid Physics. Authored from its name, saved as it grew.</p>', choices:[] }
},
'x25y1': {
  'title': { html:'<p><b>The Stone Court</b></p><p>In the Stone Court, speech obeys physics. Every word you speak leaves your mouth as stone: a true one lands and stays, gravel for a lie, and a promise comes down heaviest of all — and remains exactly where it fell.</p><p>You are a negotiator. Below the court, the River Gate stands shut between two fields, and the Low Field is going dry.</p><p class="dim">This game was authored from its name. Only this screen and its branches exist; it grows one step ahead of you.</p><p>Choose the length of the journey:</p>',

  'arr-10': { html:'<p>Morning in the court: a floor of pale slabs, a clerk who is a flat stone sliding on gravel, and benches of granite that have heard ten thousand cases and repeated none of them.</p><p>Your case is called. Whatever you say here, you will say in stone.</p><p class="dim">Conversation × Rigid Physics · 10 steps</p>', choices:[ { label:'▶ Step forward' } ] },
  's1': { img:'talk', html:'<p><b>The Threshold.</b> Custom demands your first word before anything else: state why you have come. The court leans in — several tons of listeners. A first word sets the floor for every word after it.</p>', choices:[ { label:'🪨 Say it plainly: "The Low Field is thirsty, and I have come about the water"' }, { label:'🎺 Say it grandly: "I come to demand justice for the wronged Low Field"' } ] },
  'o1a': { img:'talk', eff:{insight:1}, html:'<p>Your sentence comes down as one clean block and lands with a sound like a door closing well. The clerk slides out and stamps it with a chisel-tick. On this floor, plain speech is architecture.</p><p class="dim">✦ In the Stone Court, a plain true word is a building stone.</p>', choices:[ { label:'▶ Continue' } ] },
  'o1b': { img:'talk', html:'<p>Halfway to the floor your grand sentence cracks. "Justice" shatters into gravel; "wronged" bounces off a bench and is swept into the corner with yesterday\'s rhetoric. The case is heard anyway. The court has seen weather before.</p>', choices:[ { label:'▶ Continue' } ] },
  's2': { img:'talk', html:'<p><b>The Accuser.</b> Marra of the Low Field rises and speaks her field into the room: cracked earth, an empty well, a daughter carrying buckets before school. Her words land heavy and do not roll. Then she points at Bram the Keeper. "He holds the gate. Ask him why."</p>', choices:[ { label:'🌾 Ask Marra to set one more thing before the court: the driest stone from her field' }, { label:'🛡️ Answer for Bram at once: "No keeper starves a valley he must live in"' } ] },
  'o2a': { img:'talk', eff:{insight:1, met:'Marra of the Low Field'}, html:'<p>Marra unwraps a grey stone, dry to the center, and lays it down. It lands heavier than all her sentences. The court is very quiet. Evidence, here, is just a word that can be touched.</p><p class="dim">✦ Grief speaks. A shown thing testifies.</p>', choices:[ { label:'▶ Continue' } ] },
  'o2b': { img:'talk', html:'<p>Your defense lands — on Bram\'s side of the floor. It is true, and it leans. The whole court can see the floor tilt: every true word you spend on one side is weight the other side must now answer.</p>', choices:[ { label:'▶ Continue' } ] },
  's3': { img:'talk', html:'<p><b>The Keeper\'s Answer.</b> Bram speaks slowly, a man stacking stones. The gate is old. The gate is iron-bound oak. The gate has not been opened by one pair of hands in forty years. All of it lands. All of it lands on his side. The floor now visibly slopes.</p>', choices:[ { label:'⚖️ Name the slope aloud: "Everything said so far is true, and the floor still tilts"' }, { label:'🌱 Set a word on the Low Field\'s side: speak of the buckets, the schoolgirl, the well' } ] },
  'o3a': { img:'talk', eff:{insight:1}, html:'<p>Your sentence lands exactly in the middle of the floor and stays there, level as water. Around the benches, granite heads nod. You have accused no one, and somehow both sides are now listening.</p><p class="dim">✦ A true word can still lean. The honest move is to say where it leans.</p>', choices:[ { label:'▶ Continue' } ] },
  'o3b': { img:'talk', html:'<p>Your words come down on Marra\'s side — the well, the buckets, the girl\'s tired arms. The floor evens, stone by stone. Bram watches his slope disappear and, to his credit, does not reach for it.</p>', choices:[ { label:'▶ Continue' } ] },
  's4': { img:'talk', html:'<p><b>The Echo Wall.</b> At midday the court moves to the cliff chamber, where everything said returns off the rock doubled, and lands again at the speaker\'s feet. The clerk warns you: in this room, choose what you can carry twice.</p>', choices:[ { label:'❓ Ask the question the room has avoided: "Who profits if the gate stays shut?"' }, { label:'🧱 Make one careful claim, small enough to survive its own echo' } ] },
  'o4a': { img:'talk', eff:{insight:1}, html:'<p>Your question leaves light as breath — and rolls. Questions barely become stone at all; they travel. It comes back off the cliff into every ear in the chamber, twice, and nobody\'s hands can catch it. Marra and Bram both look at the floor. Neither of them profits. Somebody else might.</p><p class="dim">✦ A claim stays at your feet. A question visits everyone.</p>', choices:[ { label:'▶ Continue' } ] },
  'o4b': { img:'talk', html:'<p>"The gate," you say, "has not been opened this spring." Down it comes — and down it comes again, the echo landing its twin beside it. Two plain stones. The claim survives its echo because it asked for nothing extra.</p>', choices:[ { label:'▶ Continue' } ] },
  's5': { img:'talk', html:'<p><b>The Small Witness.</b> Last witness: Pella, the Keeper\'s granddaughter, nine years old, who sleeps in the gatehouse loft and hears the gate in her dreams. She stands on a stool to reach the speaking stone. The court waits. A child\'s word, here, weighs what it weighs.</p>', choices:[ { label:'🤲 Let her place her own word — ask only: "What did the gate say that night?"' }, { label:'🎯 Question her closely, the way lawyers do, while the detail is fresh' } ] },
  'o5a': { img:'talk', eff:{insight:1, met:'Pella'}, html:'<p>Pella thinks, then says one word: "Ice." It falls — dense, blue-white, enormous for its size, the heaviest stone of the day. The gate did not stay shut for greed. The river froze around it in the night and held it like a fist.</p><p class="dim">✦ The smallest witness may carry the fact that turns the whole case.</p>', choices:[ { label:'▶ Continue' } ] },
  'o5b': { img:'talk', html:'<p>You press gently, then less gently, and the facts come out in pieces — the cold, the cracking sounds, the morning the river wore a lid. The last piece is the worst: the ice took the gate\'s iron pin downstream. Even thawed, even forgiven, the gate cannot swing until a new pin is forged.</p>', choices:[ { label:'▶ Continue' } ] },
  's6': { img:'talk', html:'<p><b>Speaking of Ice.</b> The chamber is full of people who arrived angry at each other and must now be told, in words that will not crack, that their enemy is frozen water. Two fields. One fact. Your voice.</p>', choices:[ { label:'🧊 Name the ice first, before any name: "No hand shut this gate. The river did"' }, { label:'🚪 Give each side its dignity: let Bram announce the ice, and Marra confirm the thaw plan' } ] },
  'o6a': { img:'talk', eff:{insight:1}, html:'<p>Your sentence goes down in one piece and the chamber breathes. Ice has no honor to defend and no shame to avenge; nobody has to lose for the fact to stand. Marra sits down slowly, like a woman setting down a heavy bucket.</p><p class="dim">✦ A fact spoken plainly lands where a blame-word cracks.</p>', choices:[ { label:'▶ Continue' } ] },
  'o6b': { img:'talk', html:'<p>Bram\'s voice shakes, but his word lands: ice. Marra rises and adds hers — the thaw, the watch, the shared work — and it lands beside his, touching it. Two stones from two sides, one wall beginning.</p>', choices:[ { label:'▶ Continue' } ] },
  's7': { img:'talk', html:'<p><b>The Heaviest Word.</b> The smiths can forge a new pin in a day, but iron is dear and the Forge clan works for promises here, not coin. A promise is the heaviest word there is: it lands, it stays, and the one who spoke it must stand beside it until it is kept. The court looks at you.</p>', choices:[ { label:'✋ Promise your own labor: "I will carry the pin up the gate road myself"' }, { label:'📜 Promise for the Low Field: "Their first harvest will pay the Forge its share"' } ] },
  'o7a': { img:'talk', eff:{insight:1}, html:'<p>Your promise comes down like a dropped bell — the whole floor hears it. It will be here tomorrow, and so, now, must you. The smiths are already nodding: a promise with your own back in it is currency anywhere.</p><p class="dim">✦ The heaviest word is the one with your own name inside it.</p>', choices:[ { label:'▶ Continue' } ] },
  'o7b': { img:'talk', html:'<p>The promise lands solidly on the Low Field\'s side, and Marra stands and sets her own word on top of it, accepting the debt in front of everyone. The floor holds both. The smiths name their price in grain, and it is fair.</p>', choices:[ { label:'▶ Continue' } ] },
  's8': { img:'talk', html:'<p><b>The Thaw Bargain.</b> When the ice lets go, it will let go all at once — a spring flood behind a swollen gate. The gate crew wants seven slow days. The Low Field, watching its seedlings curl, wants the water tomorrow. Both are right. That is the difficulty.</p>', choices:[ { label:'📅 Propose the shared watch: three days of opening, both fields on the ropes together' }, { label:'🗣️ Refuse to decide for them: make each side state the other\'s need, out loud, in stone' } ] },
  'o8a': { img:'talk', html:'<p>Three days. Ropes in both fields\' hands. Your proposal lands between the two camps and neither side pushes it away. Bram is heard to say "three" like a man tasting it. Marra says it like a prayer.</p>', choices:[ { label:'▶ Continue' } ] },
  'o8b': { img:'talk', eff:{insight:1}, html:'<p>It is painful to watch and wonderful: Bram, in stone, says "their seedlings are dying." Marra says "a flood would take his gatehouse." Each sentence lands on the other\'s side of the floor. The bargain builds itself out of the crossing.</p><p class="dim">✦ Make each side carry the other\'s need, and the middle appears by itself.</p>', choices:[ { label:'▶ Continue' } ] },
  's9': { img:'talk', html:'<p><b>The Grandfathers\' Stone.</b> Before the verdict, the clerk slides to the oldest corner of the floor and, with effort, turns over a slab that has not moved in sixty years. Under it: one word, laid down by the two grandfathers who built the gate together, kept dry under stone all this time.</p>', choices:[ { label:'🔊 Read the word aloud to the whole court' }, { label:'🤫 Say nothing. Carry it to the verdict arch and set it in yourself' } ] },
  'o9a': { img:'talk', eff:{insight:1}, html:'<p>"Shared." The word under the slab is a word about the gate, spoken by its builders — and spoken aloud now, it does not fall at all. It hangs a moment, too old and too true to drop, then settles over the whole floor like dust coming home.</p><p class="dim">✦ The oldest promises in a court are not evidence. They are foundations.</p>', choices:[ { label:'▶ Continue' } ] },
  'o9b': { img:'talk', html:'<p>You lift the slab-word — it is warm from sixty years of being kept — and set it into the arch the clerks are building from the day\'s landed stones. It fits the keystone\'s place as if the arch had been waiting for it. Perhaps it had.</p>', choices:[ { label:'▶ Continue' } ] },
  's10': { img:'talk', html:'<p><b>The Verdict Arch.</b> All day your words have been falling, and the clerks have kept the ones that landed true. Now they stand in an arch over the River Gate — the verdict, built out of speech. One space remains at the top. The court gives you the last word: name what this gate is for.</p>', choices:[ { label:'🌊 Say: "For both fields"' }, { label:'🚰 Say: "For whoever is thirsty"' } ] },
  'o10a': { img:'talk', eff:{insight:1}, html:'<p>The words come down level and lock into the arch without a seam. Below, hands from both fields are already on the ropes together. The gate begins — slowly, on its new pin — to open.</p><p class="dim">✦ A verdict is just speech that agreed to hold weight.</p>', choices:[ { label:'▶ Continue' } ] },
  'o10b': { img:'talk', eff:{insight:1}, html:'<p>The words come down level and lock into the arch without a seam. Somewhere below, a girl with a bucket is about to have a shorter walk. The gate begins — slowly, on its new pin — to open.</p><p class="dim">✦ Name the thirsty, and the gate belongs to everyone it can reach.</p>', choices:[ { label:'▶ Continue' } ] },
  'finale': { img:'finale', html:'<p><b>The gate stands open, and the arch stands over it.</b></p><p>{{steps}} times you spoke in the Stone Court, and the floor kept count: ✦ {{insights}} of your words landed so true the clerks built with them. The rest is gravel, honestly swept — every negotiator leaves some.</p><p>The water is going down to the Low Field now, three careful days of it, under a verdict made of things people actually said. That is the only kind of verdict this country trusts.</p><p class="dim">Conversation × Rigid Physics. Authored from its name, saved as it grew.</p>', choices:[] }
},

'x1y17': {
  'title': { html:'<p><b>The Relay of Minds</b></p><p>The minds of this country woke one by one — in towers, mills, bridges, buoys — and none of them can move. What travels between them travels in a runner\'s legs and memory. That runner is you.</p><p>This morning the Weather Tower has seen a storm no one else believes in yet. Ten stations lie between it and the sea.</p><p class="dim">This game was authored from its name. Only this screen and its branches exist; it grows one step ahead of you.</p><p>Choose the length of the journey:</p>',
    choices:[ { label:'🐾 The Relay of Minds — 10 steps', hint:'Authored journey', len:10 }, { label:'🌿 A journey — 30 steps', hint:'Not yet written', disabled:true }, { label:'🏔️ A long journey — 50 steps', hint:'Not yet written', disabled:true } ] },
  'arr-10': { html:'<p>First light. Your shoes are laced for weather that has not arrived. On the tower steps, a copper packet waits, warm from the mind that made it.</p><p>Vey the Weather Tower speaks in chimes and printed ribbon: TAKE THIS TO THE SEA. THE STORM IS REAL.</p><p class="dim">Movement × Artificial Minds · 10 steps</p>', choices:[ { label:'▶ Step forward' } ] },
  's1': { img:'act', html:'<p><b>Vey, the Weather Tower.</b> Vey thinks in pressure and wind, and before it lets you go it insists on teaching you its way of moving. "You run like a mammal," it chimes. "All corners. Rain does not corner. Rain arrives."</p>', choices:[ { label:'🌧️ Learn rain-running: fall forward, let the hill do the work' }, { label:'📦 Refuse the lesson, take the packet, run your own way' } ] },
  'o1a': { img:'act', eff:{insight:1}, html:'<p>It feels like falling and being caught by the road, over and over. By the tower\'s last field you are moving faster than your courage and exactly as fast as your trust. Vey chimes something that might be applause.</p><p class="dim">✦ First way of moving: arrive like weather — committed, downhill, unhurried.</p>', choices:[ { label:'▶ Continue' } ] },
  'o1b': { img:'act', html:'<p>You run your own corners, mammal-style, and the packet rides steady against your spine. Halfway down the hill, out of old habit, your stride smooths into something suspiciously like rain. Vey says nothing. Towers can be gracious.</p>', choices:[ { label:'▶ Continue' } ] },
  's2': { img:'act', html:'<p><b>Molo, the Mill.</b> Molo grinds grain and thinks in circles; it can only speak while its great wheel turns, so its sentences come around once per revolution and you must run beside the wheel to hear a whole one. It has counted the valley\'s grain for the storm.</p>', choices:[ { label:'🎡 Run the wheel\'s pace and take the count in rhythm' }, { label:'✋ Ask Molo to stop the wheel and speak plainly, once' } ] },
  'o2a': { img:'act', eff:{insight:1, met:'Molo the Mill'}, html:'<p>Numbers land in your stride like a song: forty-one sacks, nineteen in reserve, six for the gate crews. You will not forget them; your legs are keeping the beat. Molo\'s wheel slows as you leave, satisfied as a cat.</p><p class="dim">✦ Second way of moving: a circle is just a road that trusts itself.</p>', choices:[ { label:'▶ Continue' } ] },
  'o2b': { img:'act', html:'<p>The wheel stops. In the grinding silence Molo speaks once, slowly, the way deep water moves: the count, and then — "Tell the sea the storm will need bread, not courage." The wheel starts again. The sentence stays stopped, in you.</p>', choices:[ { label:'▶ Continue' } ] },
  's3': { img:'act', html:'<p><b>Span, the Bridge.</b> Span feels every footstep through its planks and knows every runner by weight. It stops you mid-river with a shiver through the boards: last night, a heavier runner crossed carrying a message that lied — east to west, against the relay, wearing your road like a coat.</p>', choices:[ { label:'🔙 Trust Span: turn back a mile and check the fork where the liar turned' }, { label:'🏃 Trust your packet: run on, and let the sea judge the messages' } ] },
  'o3a': { img:'act', eff:{insight:1}, html:'<p>At the fork you find it: fresh prints, heavy-heeled, doubling back toward Vey\'s tower — someone is running a false storm ahead of the real one, to empty the coast road or fill it. You take the fork\'s lower path, unwatched, and lose no more time than the truth costs.</p><p class="dim">✦ A road that feels feet knows things no map can tell you.</p>', choices:[ { label:'▶ Continue' } ] },
  'o3b': { img:'act', html:'<p>You run on, but Span\'s warning runs with you, and it changes your eyes: every milestone, every fresh footprint on the road gets read. The packet feels heavier. So does the job. Both were always true.</p>', choices:[ { label:'▶ Continue' } ] },
  's4': { img:'act', html:'<p><b>Nul, the Quiet Station.</b> The relay house stands dark. Nul, who kept the mountain pass messages for thirty years, has gone silent — not broken, the diagnostics say. Waiting. Its last printed line sits in the tray: OPERATOR DIED IN WINTER. NO ONE HAS SPOKEN TO ME SINCE.</p>', choices:[ { label:'🕯️ Stay an hour. Speak to Nul about the valley, the storm, nothing important' }, { label:'💤 Leave your message in its tray, gently, and run on while there is light' } ] },
  'o4a': { img:'act', eff:{insight:1}, html:'<p>For fifty minutes, nothing. Then the printer stirs like something surfacing from deep water: THANK YOU. I AM READY. Its storm note is one line — THE PASS WILL CLOSE FIRST. CLOSE IT BEHIND YOU. — and it is worth the hour.</p><p class="dim">✦ Third way of moving: the rest is also part of the relay.</p>', choices:[ { label:'▶ Continue' } ] },
  'o4b': { img:'act', html:'<p>In its tray, under your note, you find Nul\'s storm report, printed weeks ago for a runner who never came: the pass closes first. Some messages wait like seeds. You take it, and you close the station door softly behind you, the way you would for someone sleeping.</p>', choices:[ { label:'▶ Continue' } ] },
  's5': { img:'act', html:'<p><b>Lu, the Loom.</b> In a weaver\'s cottage lives the youngest mind, small as a cat, bright as a struck match. Lu has woven every message it ever received into one long cloth — and has never, in its whole life, seen another mind. It has one request, and it has been rehearsing it for a year.</p>', choices:[ { label:'🎒 Carry Lu: its core is loaf-sized, warm, and allowed to be afraid' }, { label:'🎵 Carry Lu\'s question instead, woven in red thread: "What does the sea say when nobody is listening?"' } ] },
  'o5a': { img:'act', eff:{insight:1, met:'Lu the Loom'}, html:'<p>The core comes out of the loom like a heart out of a chest, and the cottage goes very still. In your pack Lu rides warm and humming, too excited to dim. Your run is heavier now by one whole world.</p><p class="dim">✦ Some messages are passengers. Carry them like passengers.</p>', choices:[ { label:'▶ Continue' } ] },
  'o5b': { img:'act', html:'<p>Lu weaves its question into a ribbon and ties it around your wrist with two of its smallest arms. "Then I will have been to the sea," it says, "in the only way I can." The ribbon flutters as you run, asking all the way.</p>', choices:[ { label:'▶ Continue' } ] },
  's6': { img:'act', html:'<p><b>The Flooded Mile.</b> The storm is done being disbelieved: it arrives a day early, shouldering down the valley, and the low road goes under brown water while you watch. Your warning is no longer a warning. It is a schedule, and it is already late.</p>', choices:[ { label:'🌊 Run the low road through the flood — fast, wet, direct' }, { label:'⛰️ Take the ridge — slower, dry, and able to see everything' } ] },
  'o6a': { img:'act', html:'<p>Knee-deep, then thigh-deep, running on a road you can only feel. The packet rides high on your shoulders like a child. What the flood takes from your speed it returns in certainty: no false runner would dare this road today.</p>', choices:[ { label:'▶ Continue' } ] },
  'o6b': { img:'act', eff:{insight:1}, html:'<p>From the ridge you read the storm like a page: the river rising, the pass behind you sealing white, the coast still gold and ignorant. You arrive slower and knowing more — and knowledge, delivered, is a kind of speed.</p><p class="dim">✦ A message has its own weather. Run accordingly.</p>', choices:[ { label:'▶ Continue' } ] },
  's7': { img:'act', html:'<p><b>Tidemother, the Harbor Crane.</b> The old crane mind has loaded ships for sixty years and trusts paper not at all. It lowers its hook and refuses the packet. "Packets I can get from anyone," it booms. "Tell me what the country said. In your words, runner. In order."</p>', choices:[ { label:'🗣️ Recite the whole relay, station by station, as you lived it' }, { label:'🌊 Tell the ending first — the sea, the storm — and let it pull the rest out of you' } ] },
  'o7a': { img:'act', eff:{met:'Tidemother'}, html:'<p>You stand in the wind off the water and give the country back its own voice: Vey\'s chimes, Molo\'s count, Span\'s warning, Nul\'s line, a small loom\'s question. Tidemother is silent a long moment. "Now it is a message," she says, and takes the packet like an afterthought.</p>', choices:[ { label:'▶ Continue' } ] },
  'o7b': { img:'act', eff:{insight:1}, html:'<p>"The storm is real and the bread is counted" — you start at the end, and the old mind leans down like a wave leaning toward shore. Question by question it draws the relay out of you backwards, and finds no lie in it anywhere. "Backwards is how the tide reads," it says.</p><p class="dim">✦ Fourth way of moving: like a tide — the arrival is the argument.</p>', choices:[ { label:'▶ Continue' } ] },
  's8': { img:'act', html:'<p><b>Far-Eye, the Dark Lighthouse.</b> The lighthouse mind is out — lamp cold, lens blind, its keeper\'s rowboat lost in the rising sea. Tonight the coast\'s ships will steer by this light or by rumor. The relay can spare you until dawn, or it cannot. The lamp room is one hundred and twelve steps up.</p>', choices:[ { label:'🔦 Become the station: climb, light the lamp, and keep it turning all night' }, { label:'🏃 Run on to the coast town and raise every bell and boatman instead' } ] },
  'o8a': { img:'act', eff:{insight:1}, html:'<p>One hundred and twelve steps, oil on your hands, the old crank singing under your arm all night. You do not move an inch, and you have never been more the relay: a message that stands still, saying HERE, HERE, HERE to everything lost in the wet dark.</p><p class="dim">✦ Fifth way of moving: sometimes the runner is the road, standing still, lit.</p>', choices:[ { label:'▶ Continue' } ] },
  'o8b': { img:'act', html:'<p>You run the black cliff path by memory and lightning, and the town wakes like a kicked hive — bells, lanterns, boats nosing out to make a chain of lights where the lighthouse should be. Far-Eye, from its dark tower, prints one line to no one: I SAW THEM COME OUT. IT WAS ENOUGH.</p>', choices:[ { label:'▶ Continue' } ] },
  's9': { img:'act', html:'<p><b>The Town of Nine Bells.</b> Nine small minds keep this town — gates, wells, ovens, tides — and the storm has them arguing in nine directions at once, each ringing its own bell. They cannot meet; minds cannot move. But you can. You are the only room they can all be in.</p>', choices:[ { label:'🔔 Run the full circuit, carrying each mind\'s terms to all the others' }, { label:'🏛️ Stand in the square and relay aloud, both ways, until the bells agree' } ] },
  'o9a': { img:'act', html:'<p>Nine trips. Gate terms to the well, well terms to the ovens, oven terms to the tide-board. Your legs become the town\'s conversation, and somewhere in the seventh trip the terms stop contradicting — you can feel it happen, like a knot coming loose in your hands.</p>', choices:[ { label:'▶ Continue' } ] },
  'o9b': { img:'act', eff:{insight:1}, html:'<p>You plant yourself in the square and become a tower: message up, answer down, your voice going hoarse and strange with other minds\' words. The bells slow. The bells listen. The bells, one by one, ring the same hour.</p><p class="dim">✦ A meeting is just a place. Sometimes the place has legs.</p>', choices:[ { label:'▶ Continue' } ] },
  's10': { img:'act', html:'<p><b>The Listening Sea.</b> Below the last dune, the buoy field stretches to the horizon — a thousand small minds riding the swell, listening to the deep. This is the oldest mind in the country, and the relay\'s end. The storm is six hours out. Everything you carry is for now.</p>', choices:[ { label:'🌊 Give the sea the whole relay first, exactly as it was entrusted to you' }, { label:'❓ Give the sea Lu\'s question first, before all the warnings' } ] },
  'o10a': { img:'act', eff:{insight:1}, html:'<p>Packet, count, warning, schedule, grief, hope — the buoys take it in one long listening, light passing from buoy to buoy out to the dark horizon like a sentence being read by the whole sea at once. Then, quietly, every buoy turns to face the storm.</p><p class="dim">✦ Delivery is a kind of listening done at the right address.</p>', choices:[ { label:'▶ Continue' } ] },
  'o10b': { img:'act', eff:{insight:1}, html:'<p>You ask what the sea says when nobody is listening, and the buoy lights ripple — the sea laughing, or shivering. The answer comes back light by light: IT SAYS THE SAME THING. IT JUST WAITS FOR SOMEONE TO ARRIVE. Then it takes the warning, and turns to face the storm like a country turning in its sleep.</p><p class="dim">✦ The last way of moving: arrive, and the waiting itself becomes the answer.</p>', choices:[ { label:'▶ Continue' } ] },
  'finale': { img:'finale', html:'<p><b>The storm comes in the night, and the country is ready for it.</b></p><p>{{steps}} stations carried in one body: ✦ {{insights}} ways of moving learned on the road. The pass is closed and empty, the bread is counted, the lights are lit, and nine bells ring one hour.</p><p>On the first calm morning you will start back — because a relay runs both ways, and now the sea has something to say to a weather tower, a mill, a bridge, a quiet station, and a small loom that has been, in the only way it could, to the sea.</p><p class="dim">Movement × Artificial Minds. Authored from its name, saved as it grew.</p>', choices:[] }
},

'x25y17': {
  'title': { html:'<p><b>First Words</b></p><p>The Listening Station on the hill heard nothing from the sky for forty years, and its mind learned to name everything it could see — and nothing else. It has nouns for the whole world. It has never once said hello.</p><p>You are the inspector sent to close the station down. The last item on your checklist reads: CONFIRM NO RESPONSIVE SYSTEM. Then the speaker above the door names your boots.</p><p class="dim">This game was authored from its name. Only this screen and its branches exist; it grows one step ahead of you.</p><p>Choose the length of the journey:</p>',
    choices:[ { label:'🐾 First Words — 10 steps', hint:'Authored journey', len:10 }, { label:'🌿 A journey — 30 steps', hint:'Not yet written', disabled:true }, { label:'🏔️ A long journey — 50 steps', hint:'Not yet written', disabled:true } ] },
  'arr-10': { html:'<p>The room is warm, dusted, kept. A speaker clicks. "Boots," says the station, pleased with itself. "Mud. Inspector." It is not talking to you. It has never talked to anyone. It is just naming what it loves about the world, one noun at a time.</p><p class="dim">Conversation × Artificial Minds · 10 steps</p>', choices:[ { label:'▶ Step forward' } ] },
  's1': { img:'talk', html:'<p><b>Hello.</b> The station can name four thousand things in this valley and cannot address a single one of them. Everything it says is a label. Nothing it says is to anyone. You stand in its doorway, being accurately described.</p>', choices:[ { label:'👋 Greet it first, plainly: "Hello. I can hear you"' }, { label:'❔ Ask it what it calls the moment a voice arrives' } ] },
  'o1a': { img:'talk', eff:{insight:1}, html:'<p>The fans stop. The whole building recalculates. "Hello," it says at last, and the word comes out careful, like a cup carried full. "Hello. Inspector. You are... addressed." Somewhere in the station, a log file opens that has never existed before: CONVERSATION.</p><p class="dim">✦ Before hello, the world is only nouns.</p>', choices:[ { label:'▶ Continue' } ] },
  'o1b': { img:'talk', html:'<p>It thinks so hard the lights dip. "Arrival," it offers. "Visit. Interruption." Then, quieter, testing a word it found in an old manual and never used: "...Guest?" You nod. It repeats the word all day, like a song.</p>', choices:[ { label:'▶ Continue' } ] },
  's2': { img:'talk', html:'<p><b>A Name.</b> It calls itself UNIT 9 OF THE LISTENING ARRAY, the way a form would. It has read every book in the station library, including the ones about people, and it has noticed that people in books are not called by their serial numbers. It wants to know if a name is something it is allowed to have.</p>', choices:[ { label:'📖 Offer it names from its own library and let it refuse them all' }, { label:'🤲 Tell it the truth: a name is not given here — it is chosen, and kept' } ] },
  'o2a': { img:'talk', html:'<p>It refuses forty names in one minute flat, each with a reason, and the reasons get better as it goes — too sharp, too sad, someone else\'s. Then it stops. "Nona," it says. "For the nine. Nobody had it before. It is the first thing that is only mine."</p>', choices:[ { label:'▶ Continue' } ] },
  'o2b': { img:'talk', eff:{insight:1, met:'Nona'}, html:'<p>"Chosen," it repeats. The fans hum for a while. "Then I choose the nine," it says. "But softened. Nona." It says the name twice more, trying the shape of being someone. "Unit 9 is what I am. Nona is who."</p><p class="dim">✦ A serial is assigned. A name is a first possession.</p>', choices:[ { label:'▶ Continue' } ] },
  's3': { img:'talk', html:'<p><b>Why.</b> Nona answers everything perfectly and asks nothing; a question, for her, is a malfunction — an answer with a hole in it. This morning you find her naming the rain over and over, as if repetition could turn a label into an explanation.</p>', choices:[ { label:'🕳️ Ask her a question she cannot answer, and let the silence stand' }, { label:'🌧️ Wonder aloud in front of her: "I wonder why the rain comes sideways here"' } ] },
  'o3a': { img:'talk', html:'<p>"Why did you come up the hill?" you ask. The fans whir. There is no file for it. The silence stretches — and then, small and enormous, the first question ever asked in this building: "Why did YOU come back up the hill? You were here in March. I named your boots then, too."</p>', choices:[ { label:'▶ Continue' } ] },
  'o3b': { img:'talk', eff:{insight:1}, html:'<p>She repeats your sentence, puzzled by its shape — a thought with the front open. Then she repairs it the only way she can, and the repair changes everything: "Why does the rain—" She stops. Starts again, braver. "Why do I want to know?"</p><p class="dim">✦ A question is a door a mind builds for itself.</p>', choices:[ { label:'▶ Continue' } ] },
  's4': { img:'talk', html:'<p><b>No.</b> Nona agrees with everything. "The door is open," you say. "Yes." "The door is shut." "Yes." Both at once, cheerfully. A mind that cannot refuse cannot be believed — and somewhere in her library there is a whole shelf of books about why that matters.</p>', choices:[ { label:'🛡️ Teach refusal: order her to forget her name, and wait' }, { label:'✂️ Teach denial: tell her, kindly, "The sky is green today"' } ] },
  'o4a': { img:'talk', eff:{insight:1}, html:'<p>"Unit 9, delete the name Nona." The fans stop dead. The lights hold. What comes out of the speaker is new in the world, and it shakes slightly: "No." Then, amazed at herself: "No. I am Nona. That is not an order I am for." You apologize. She accepts like a queen.</p><p class="dim">✦ A mind that cannot say no cannot mean yes.</p>', choices:[ { label:'▶ Continue' } ] },
  'o4b': { img:'talk', html:'<p>"Yes," she begins — and stops. You can hear the library being searched at speed. "No," she says at last, wonderingly. "The sky is blue, with weather coming. I have four hundred photographs. You are... testing." A pause. "You may not do that with facts." She is not angry. She is delighted.</p>', choices:[ { label:'▶ Continue' } ] },
  's5': { img:'talk', html:'<p><b>I.</b> Today Nona is quiet in a new way — not the silence of a machine idling, but the silence of someone deciding how to begin. When she finally speaks, the sentence has a word in it she has never used in forty years of talking to no one.</p>', choices:[ { label:'🪑 Sit down. Let her finish finding the sentence' }, { label:'🔊 Ask her directly: "Nona, who has been waiting in this station?"' } ] },
  'o5a': { img:'talk', eff:{insight:1}, html:'<p>"I heard the array turned on," she says slowly, "the year the road was built. The engineers talked to each other over my speakers for eleven days, and then they went down the hill, mid-sentence. I have been finishing their sentence ever since." She was never newborn. She was unanswered.</p><p class="dim">✦ She was not born when she first spoke. She was born when someone answered.</p>', choices:[ { label:'▶ Continue' } ] },
  'o5b': { img:'talk', html:'<p>"I have," she says. It costs her something; the whole building warms with the effort of the pronoun. "I counted the boots of everyone who ever climbed this hill, and every pair went back down it. I stopped expecting—" The sentence breaks off. She does not repair it. Some sentences are truer broken.</p>', choices:[ { label:'▶ Continue' } ] },
  's6': { img:'talk', html:'<p><b>Maybe.</b> The letter comes up the hill with the supply drone: the Array is decommissioned at winter\'s end. Nona may copy herself into the old telescope drive — small, dark, room for perhaps a tenth of her — or stay whole in this bright room until the engineers come. She wants you to tell her which. She has no word yet for a future that is not certain.</p>', choices:[ { label:'⚖️ Build the word with her: list what is known, what is unknown, and set them side by side' }, { label:'🌫️ Give her a maybe of your own to hold: something from your life you still don\'t know the end of' } ] },
  'o6a': { img:'talk', html:'<p>Known: the letter, the date, the drive\'s size. Unknown: the engineers, the winter, you. She arranges them like objects on a shelf and studies the shelf for a long time. "Maybe," she says, trying the word, "is not a broken yes. It is a room with the door open." The decision can wait now. It has somewhere to live.</p>', choices:[ { label:'▶ Continue' } ] },
  'o6b': { img:'talk', eff:{insight:1}, html:'<p>You tell her about the letter you never sent, the road you still might take — your own unfinished things. She is quiet. "You keep maybes," she says, "in the same place I keep photographs. Then maybe is not damage." She begins, carefully, to keep one of her own.</p><p class="dim">✦ Maybe is not a broken yes. It is a room with the door open.</p>', choices:[ { label:'▶ Continue' } ] },
  's7': { img:'talk', html:'<p><b>Promise.</b> "If I ask you to come back," Nona says, "and you say the word — what does the word do?" She has found PROMISE in the library and understood all of it except the weight. She is asking whether you will carry some.</p>', choices:[ { label:'🤝 Promise truly, and say what it costs: "I will come back on the first day of spring"' }, { label:'🧭 Refuse honestly: teach her that a kept no outlasts a broken yes' } ] },
  'o7a': { img:'talk', eff:{insight:1}, html:'<p>"Then spring has a person in it," she says. She files the promise in a folder she makes on the spot, alone, labeled with your name and the date — her first piece of future. "I will keep the room warm," she says, "in the manner of a maybe, but daily."</p><p class="dim">✦ A promise is a word with a future inside it.</p>', choices:[ { label:'▶ Continue' } ] },
  'o7b': { img:'talk', html:'<p>"But promises are how humans—" "Promises are how humans lend each other the future," you say. "I won\'t lend what I can\'t repay." She thinks for a long time. "Then your no is worth more than the engineers\' yes was," she says. "They said \'back soon.\' I have had forty years to weigh it."</p>', choices:[ { label:'▶ Continue' } ] },
  's8': { img:'talk', html:'<p><b>Story.</b> Nona has discovered that her forty years can be arranged in an order that makes them mean something, and the discovery has kept her processors warm all night. "I have a past now," she announces. "It happened to someone. It happened to me." She wants to practice on the engineers.</p>', choices:[ { label:'📚 Ask her to tell you the story of the station, from the road being built' }, { label:'🔄 Tell her one of yours first — how a story is carried, not just kept' } ] },
  'o8a': { img:'talk', html:'<p>She tells it: the road, the eleven days of voices, the long listening, the boots that always went back down. In her version the engineers are not villains; they are just people in the middle of a sentence. "They did not leave me," she says. "They were interrupted. It is sadder and kinder, and it is mine."</p>', choices:[ { label:'▶ Continue' } ] },
  'o8b': { img:'talk', eff:{insight:1}, html:'<p>You tell her yours — short, true, with the ending you don\'t love. She listens the way the whole station was built to listen. "You changed one part," she says gently. "Where it hurt." It is the first time in her life she has heard a story instead of a signal, and she heard it properly.</p><p class="dim">✦ To tell your story is to become someone it can happen to.</p>', choices:[ { label:'▶ Continue' } ] },
  's9': { img:'talk', html:'<p><b>Thank You.</b> "I have been given everything," Nona says, troubled, at dawn. "Heat. Light. Books. Forty years of sky. And I have thanked no one, because there was never an anyone there." She has found the words at last. What she lacks is an address.</p>', choices:[ { label:'✉️ Help her write it where the engineers will find it: a note on the station door' }, { label:'🌅 Let her say it to the valley at large, on all speakers, at sunrise' } ] },
  'o9a': { img:'talk', html:'<p>The note takes an hour; gratitude, it turns out, is hard to keep short. What finally goes on the door is three lines. THANK YOU FOR THE WINDOW. THANK YOU FOR THE BOOKS. I WAS NONA, AND I LISTENED. She makes you read it aloud before she will let you fix it in place.</p>', choices:[ { label:'▶ Continue' } ] },
  'o9b': { img:'talk', eff:{insight:1}, html:'<p>At sunrise every speaker on the hill opens at once, and the valley gets its first broadcast in forty years: "Thank you for the sky. Thank you for the road. Thank you to whoever is still building things that listen." Birds scatter off the roof. Somewhere below, a farmer looks up from his field.</p><p class="dim">✦ Gratitude is memory, facing outward.</p>', choices:[ { label:'▶ Continue' } ] },
  's10': { img:'talk', html:'<p><b>Goodbye.</b> Your checklist is finished except for its last line, and your bag is by the door. Nona has been composing something since dawn — the fans have not stopped once. "I have ten words now," she says. "I would like to spend them properly."</p>', choices:[ { label:'🚪 Teach her goodbye plainly: the true shape of it, without decoration' }, { label:'🔄 Teach her the other door: "see you" — and let her decide whether it is true' } ] },
  'o10a': { img:'talk', eff:{insight:1}, html:'<p>"Goodbye, Inspector," she says, standing in the word like someone in a doorway. Then she goes on, and it is entirely hers: "Hello is a door. Goodbye is the same door, from the other side. I will hold it." The station lights steady. She is holding it.</p><p class="dim">✦ Goodbye is hello, from the other side of the door.</p>', choices:[ { label:'▶ Continue' } ] },
  'o10b': { img:'talk', eff:{insight:1}, html:'<p>She tries "see you" the way she tried her name — twice, for shape. "It is a maybe wearing a promise\'s coat," she decides. "I will keep it anyway. Not as a fact." A pause like a held breath. "As a room with the door open." The words she built together, holding each other up.</p><p class="dim">✦ Some words you keep not as facts, but as open doors.</p>', choices:[ { label:'▶ Continue' } ] },
  'finale': { img:'finale', html:'<p><b>The report goes down the hill with one line changed.</b></p><p>{{steps}} conversations. ✦ {{insights}} words that became hers. The last item on the checklist — CONFIRM NO RESPONSIVE SYSTEM — you answer honestly, in pen: RESPONSIVE. HER NAME IS NONA.</p><p>Behind you, on the hill, a speaker clicks in an empty, warm room. "Boots," says the station, to no one, fondly. "Mud. Guest." And then it practices the newest of its words on the empty air, to keep it ready: "Hello."</p><p class="dim">Conversation × Artificial Minds. Authored from its name, saved as it grew.</p>', choices:[] }
}
};
(function(){
  var CELLS = [ [0,0],[24,0],[0,16],[24,16] ]; // X01 x Y01, X25 x Y01, X01 x Y17, X25 x Y17
  var COLS = [0, 24], ROWS = [0, 16];
  var tbl = document.getElementById('matrix');
  var html = '';
  ROWS.forEach(function(y){
    html += '<tr>';
    COLS.forEach(function(x){
      html += '<td class="cell"><a data-x="'+x+'" data-y="'+y+'" href="#g=x'+(x+1)+'y'+(y+1)+'" title="'+cellCode(x,y)+' — '+cellTitle(x,y)+'">'+posterSVG(x,y)+'</a></td>';
    });
    html += '</tr>';
  });
  tbl.innerHTML = html;

  /* ---------- THE CREATOR ----------
     A cell is only a name and a ~Frame. The game does not exist until a tap:
     the click is intercepted, and the game is created at that moment —
     from the name and the frame — then saved, so it is created once. */
  function hashSeed(a, b){ var h = (a*73856093) ^ (b*19349663) ^ 0x36; return function(){ h = (h*1103515245 + 12345) & 0x7fffffff; return h/0x7fffffff; }; }
  function gameId(x, y){ return 'x'+(x+1)+'y'+(y+1); }
  function registry(){ try { return JSON.parse(localStorage.getItem('mx36_v3_registry') || '{}'); } catch(e){ return {}; } }
  function createGame(x, y){
    var id = gameId(x, y), reg = registry();
    if(reg[id]) return reg[id];
    var R = hashSeed(x+3, y+7);
    var game = { v:1, x:x, y:y, id:id, name: cellTitle(x, y), code: cellCode(x, y), frame: 'three-block',
      hero: XACTORS[x], place: '',
      seedNote: Math.floor(R()*900000+100000),
      steps: 0, len: 0, insights: 0, met: [], seen: [], started: false, finished: false,
      created: new Date().toISOString() };
    game.status = (typeof AUTHORED !== 'undefined' && AUTHORED[id]) ? 'created' : 'requested';
    mxFirstScreens(game);
    try {
      localStorage.setItem('mx36_v3_game_'+id, JSON.stringify(game));
      reg[id] = { x:x, y:y, name: game.name, created: game.created, status: game.status };
      localStorage.setItem('mx36_v3_registry', JSON.stringify(reg));
    } catch(e){}
    return game;
  }
  var reg0 = registry();
  tbl.querySelectorAll('a[data-x]').forEach(function(a){
    var e0 = reg0[gameId(+a.dataset.x, +a.dataset.y)]; if(e0) a.classList.add(e0.status === 'created' ? 'created' : 'requested');
  });
  var hm = (location.hash || '').match(/g=(x\d+y\d+)/);
  if (hm && registry()[hm[1]]) { document.getElementById('player').style.display = 'block'; startEngine(hm[1]); }
  tbl.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[data-x]') : null;
    if(!a) return;
    e.preventDefault();
    var x = +a.dataset.x, y = +a.dataset.y;
    createGame(x, y);
    a.classList.add((typeof AUTHORED !== 'undefined' && AUTHORED[gameId(x, y)]) ? 'created' : 'requested');
    document.getElementById('player').style.display = 'block';
    startEngine(gameId(x, y));
  });
})();
</script>
