<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:#12101a; color:#f2ead9; font-family:Georgia,'Times New Roman',serif;
        display:flex; justify-content:center; }
  #app{ width:100%; max-width:480px; height:100dvh; display:flex; flex-direction:column; background:#1a1626; }
  #picWrap{ position:relative; flex:0 0 42dvh; background:#0d0a14; }
  #picWrap.poster{ flex:0 0 64dvh; }
  #picWrap.poster #sceneImg{ object-fit:contain; }
  #sceneImg{ width:100%; height:100%; object-fit:cover; display:block; }
  #chips{ position:absolute; left:0; right:0; bottom:0; display:flex; gap:6px; flex-wrap:wrap;
          padding:16px 10px 8px; background:linear-gradient(transparent, rgba(10,8,18,.85));
          font-family:Verdana,sans-serif; font-size:11.5px; }
  .chip{ background:rgba(20,16,34,.85); border:1px solid #4a3d6e; border-radius:20px; padding:3px 10px; }
  .chip b{ color:#ffd98a; }
  #titleChip{ position:absolute; top:8px; left:10px; font-family:Verdana,sans-serif; font-size:11px;
          letter-spacing:2px; background:rgba(20,16,34,.8); border:1px solid #4a3d6e;
          border-radius:20px; padding:4px 12px; }
  #fsBtn{ position:absolute; top:8px; right:10px; width:34px; height:34px; border-radius:50%;
          background:rgba(20,16,34,.85); border:1px solid #4a3d6e; color:#f2ead9;
          font-size:16px; cursor:pointer; line-height:1; }
  #desc{ flex:1; overflow-y:auto; padding:18px 20px 10px; font-size:17.5px; line-height:1.6; }
  #desc p{ margin-bottom:12px; }
  #desc .dim{ color:#b7a9d6; font-size:15px; }
  #desc b{ color:#ffd98a; font-weight:bold; }
  #choices{ flex:0 0 auto; padding:8px 10px calc(10px + env(safe-area-inset-bottom));
            display:flex; flex-direction:column; gap:7px; max-height:24dvh; overflow-y:auto;
            background:#12101a; border-top:1px solid #352b52; }
  .choice{ font-family:Verdana,sans-serif; font-size:15.5px; text-align:left; cursor:pointer;
           background:#2a2145; color:#f2ead9; border:1px solid #574a80; border-radius:12px;
           padding:10px 14px; min-height:46px; width:100%; }
  .choice:active{ background:#3a2d5e; }
  .choice .hint{ display:block; font-size:12.5px; color:#b7a9d6; margin-top:3px; }
  .choice.primary{ background:#4a2d6e; border-color:#8a6ad6; }
  .choice.disabled{ opacity:.45; background:#211a38; cursor:default; }
  a{ color:#c9a7ff; }

<body>
<div id="app">
  <div id="picWrap">
    <img id="sceneImg" alt="Game cover">
    <div id="titleChip">36 × 36</div>
    <button id="fsBtn" title="Fullscreen">⛶</button>
    <div id="chips"></div>
  </div>
  <div id="desc"></div>
  <div id="choices"></div>
</div>

<script>
// THE 36 x 36 — Kirill's game taxonomy (2026-10-15). X = what the player does. Y = what the world is.
var XCAT = [
 ['Movement','🚶','move, leap and cross'],['Traversal','🧗','find the path through'],['Combat','⚔️','meet force with force'],
 ['Ranged Action','🏹','act from a distance'],['Driving','🚗','drive and steer'],['Precision','🎯','act with perfect timing'],
 ['Deduction','🔍','read the clues and deduce'],['Puzzle Solving','🧩','solve what is puzzling'],['Tactics','♟️','choose the tactic'],
 ['Strategy','🗺️','plan for the long term'],['Optimization','⚙️','find the most efficient way'],['Knowledge','📚','remember and know'],
 ['Building','🏗️','build what is missing'],['Crafting','🔨','craft what is needed'],['Design','📐','design the form'],
 ['Programming','💻','program the behavior'],['Gardening','🌱','plant and tend'],['Performance','🎤','perform for others'],
 ['Command','📣','command the team'],['Logistics','📦','move what matters, where it matters'],['Resource Management','🧮','share out what is scarce'],
 ['Business','💼','grow the enterprise'],['Exploration Planning','🧭','plan the expedition'],['Risk Management','🛡️','weigh the risk'],
 ['Conversation','💬','talk and negotiate'],['Relationship','❤️','build the relationship'],['Leadership','👑','lead the group'],
 ['Deception','🃏','play the hidden game'],['Competition','🏆','compete to win'],['Cooperation','🤝','win together'],
 ['Discovery','🔭','discover the unknown'],['Survival','🔥','endure and adapt'],['Role Embodiment','🎭','live the role'],
 ['Story Shaping','📖','shape the story'],['Reflection','🪞','look inward'],['Wonder','✨','wonder and behold']
];
var YCAT = [
 ['Rigid Physics','falling stones and solid ground'],['Fluid & Weather','rivers, rain and turning winds'],['Gravity & Motion','orbits, falls and swinging weights'],
 ['Spatial Geometry','folded spaces and impossible angles'],['Vehicles & Machines','engines, wheels and patient machines'],['Matter & Chemistry','elements that fizz, melt and transform'],
 ['Formal Rules','laws written in perfect logic'],['Signals & Networks','messages racing through a web of signals'],['Hidden Information','locked doors and buried secrets'],
 ['Time & Causality','clocks, echoes and second chances'],['Probability','dice, chances and near-misses'],['Language & Symbols','signs, ciphers and living words'],
 ['Plants & Ecosystems','forests that think in centuries'],['Animals','creatures with their own agendas'],['Human Bodies','strength, breath and healing'],
 ['Evolution','generations changing, one small step at a time'],['Artificial Minds','minds made by hands, thinking their own thoughts'],['Alien Life','life that never heard of Earth'],
 ['Communities','villages, customs and belonging'],['Institutions','offices, laws and procedures'],['Politics & Power','thrones, votes and quiet influence'],
 ['Culture & Identity','songs, masks and who-we-are'],['Conflict & Security','walls, guards and an uneasy peace'],['Trust & Reputation','promises kept and remembered'],
 ['Markets & Trade','stalls, prices and fair exchange'],['Production Chains','workshops linked hand to hand'],['Energy Systems','currents, fuels and stored lightning'],
 ['Infrastructure','roads, bridges and water in the pipes'],['Ecology & Climate','seasons, storms and balance'],['Scarcity & Abundance','empty stores and overflowing tables'],
 ['Perception','light, sound and the eye that reads them'],['Memory & Identity','what is remembered, and who it makes us'],['Emotion','joy, grief and attachment'],
 ['Ethics & Justice','hard choices and fair outcomes'],['Meaning & Belief','temples, stories and why-we-live'],['Dreams & Imagination','the country behind closed eyes']
];
var XGROUPS = ['Act & Move','Think & Decide','Create & Build','Run Systems','Talk & Influence','Explore & Experience'];
var YGROUPS = ['Space & Physics','Rules & Information','Living Systems','Society & Power','Economy & Production','Mind & Meaning'];
function cellTitle(x, y){ return XCAT[x][0] + ' × ' + YCAT[y][0]; }
function cellCode(x, y){ return 'X' + String(x+1).padStart(2,'0') + ' × Y' + String(y+1).padStart(2,'0'); }
// Deterministic generative tile: palette from the Y family, motif from X, seed from the coordinates.
function tileSVG(x, y, w){
  var yg = Math.floor(y/6), xg = Math.floor(x/6);
  var hueY = [210, 160, 95, 265, 28, 318][yg] + (y%6)*7;
  var hueX = [200, 150, 80, 255, 20, 300][xg] + (x%6)*6;
  var h = (x*73856093) ^ (y*19349663);
  function rnd(){ h = (h*1103515245 + 12345) & 0x7fffffff; return h/0x7fffffff; }
  var c1x = 40+rnd()*240, c1y = 20+rnd()*80, c1r = 26+rnd()*40;
  var c2x = 40+rnd()*240, c2y = 60+rnd()*80, c2r = 16+rnd()*30;
  var fs = w >= 300 ? 44 : 30;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">' +
   '<defs><linearGradient id="g'+x+'-'+y+'" x1="0" y1="0" x2="1" y2="1">' +
   '<stop offset="0" stop-color="hsl('+hueY+',55%,26%)"/><stop offset="1" stop-color="hsl('+hueX+',60%,16%)"/></linearGradient></defs>' +
   '<rect width="320" height="180" fill="url(#g'+x+'-'+y+')"/>' +
   '<circle cx="'+c1x+'" cy="'+c1y+'" r="'+c1r+'" fill="hsl('+hueX+',80%,65%)" opacity="0.20"/>' +
   '<circle cx="'+c2x+'" cy="'+c2y+'" r="'+c2r+'" fill="hsl('+hueY+',85%,70%)" opacity="0.16"/>' +
   '<text x="160" y="96" font-size="'+fs+'" text-anchor="middle">'+XCAT[x][1]+'</text>' +
   '<rect y="146" width="320" height="34" fill="rgba(8,6,14,0.72)"/>' +
   '<text x="160" y="168" font-size="17" fill="#f2ead9" text-anchor="middle" font-family="Verdana,sans-serif" font-weight="bold">'+cellCode(x,y)+'</text></svg>';
}

/* ================= THE ENGINE — generation one step ahead =================
   A game is never generated whole. Only the current screen exists, plus its
   branches — the screens one step ahead. Moving forward generates the next
   step's branches, and so on. Everything generated is saved with the game. */
function mxHashStr(s){ var h = 2166136261; for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h*16777619) >>> 0; } return h; }
function mxRng(key){ var h = mxHashStr(key) || 1; return function(){ h = (h*1103515245 + 12345) & 0x7fffffff; return h/0x7fffffff; }; }
var MX_FIRST = ['Ka','Vor','Sy','Mi','An','Tor','Ze','Bel','Ond','Ru','Fen','Gal','Il','Ash','Nor','Ek'];
var MX_MID = ['ber','la','mir','fen','ra','sil','to','van','ori','um','ek','dor'];
var MX_LAST = ['is','ax','une','or','ia','eth','on','ara','ix','um'];
function mxName(r){ return MX_FIRST[Math.floor(r()*16)] + MX_MID[Math.floor(r()*12)] + MX_LAST[Math.floor(r()*10)]; }
var MX_KINDS = ['meeting','discovery','making','crossroads','wonder','challenge'];
function mxSitKind(game, n){ var r = mxRng(game.id+':s'+n); return MX_KINDS[Math.floor(r()*MX_KINDS.length)]; }
function mxSitName(game, n){ var r = mxRng(game.id+':s'+n+':name'); return mxName(r); }

function mxGenScreen(game, id){
  var X = game.x, Y = game.y, act = XCAT[X][2], world = YCAT[Y][1];
  var title = game.name, code = game.code, hero = game.hero;
  if(id === 'title'){
    return { id:id, kind:'title', imgKind:'title',
      html: '<p><b>'+code+' — '+title+'</b></p>'+
        '<p>This game was created at your tap — from its name and its frame. Only this first screen and its branches exist so far; the rest of the game does not exist yet. It will be generated one step ahead of you, as you play, and everything generated is saved.</p>'+
        '<p>Here, you <b>'+act+'</b>, in a world of <b>'+world+'</b>.</p>'+
        '<p>'+hero+' is waiting at '+game.place+'. The rest has not happened yet — it cannot, until you choose.</p>'+
        '<p>Choose the length of the journey:</p>',
      choices: [
        { label:'🐾 Mini journey — 10 steps', hint:'Free', len:10 },
        { label:'🌿 A journey — 30 steps', hint:'Free', len:30 },
        { label:'🏔️ A long journey — 50 steps', hint:'Free', len:50 },
        { label:'💠 A grand journey — 100 screens', hint:'Paid · coming soon', disabled:true },
        { label:'💠 An epic journey — 1,000 screens', hint:'Paid · coming soon', disabled:true },
        { label:'💠 The Million-Step — 1,000,000 screens', hint:'Paid · coming soon', disabled:true } ],
      branches: null };
  }
  if(id.indexOf('arr-') === 0){
    var len = parseInt(id.slice(4), 10);
    return { id:id, kind:'arrival', imgKind:'arrival',
      html: '<p>The game begins at '+game.place+'.</p><p>'+hero+' looks at you the way guides do — as if the world of '+world+' had been waiting for someone who would <b>'+act+'</b>.</p><p class="dim">'+code+' · '+title+' · '+len+' steps</p>',
      choices: [ { label:'▶ Continue' } ], branches: null };
  }
  if(id === 'finale'){
    return { id:id, kind:'finale', imgKind:'finale',
      html: '<p><b>The journey is complete.</b></p>'+
        '<p>{{len}} steps through '+world+', taken by someone who came to '+act+'.</p>'+
        '<p>✦ Insights gathered: {{insights}}<br>🧑‍🤝‍🧑 Met on the way: {{met}}<br>📍 Steps walked: {{steps}}</p>'+
        '<p class="dim">This game — '+code+' — stays generated and saved in this browser, exactly as it grew.</p>',
      choices: [], branches: [] };
  }
  var m = /^s(\d+)$/.exec(id);
  if(m){
    var n = parseInt(m[1], 10), kind = mxSitKind(game, n), r = mxRng(game.id+':'+id);
    function pk(a){ return a[Math.floor(r()*a.length)]; }
    var html = '', choices = [];
    if(kind === 'meeting'){
      var nm = mxSitName(game, n);
      var kinds = ['a keeper of this place','a traveler going the other way','a maker at their work','a voice from inside the system','a guardian who asks nothing','a stranger who knows your guide'];
      html = '<p>On the way, you meet <b>'+nm+'</b>, '+pk(kinds)+' — one of those who live among '+world+'.</p><p>'+nm+' studies you, and waits to see what you will do.</p>';
      choices = [ { label:'✦ '+cap(act) }, { label:'👋 Greet them and pass' } ];
    } else if(kind === 'discovery'){
      html = '<p>The way opens onto something the maps of '+world+' do not show.</p><p>'+pk(['It has clearly been here a long time, waiting to be noticed.','It changes the way you understand everything before it.','Your guide goes quiet — even '+hero+' has not seen this.'])+'</p>';
      choices = [ { label:'🔭 Look closer' }, { label:'▶ Take it in, and walk on' } ];
    } else if(kind === 'making'){
      html = '<p>Here is a place where the world of '+world+' is unfinished — and a chance to <b>'+act+'</b>.</p>';
      choices = [ { label:'✦ Do the work' }, { label:'▶ Not this one — walk on' } ];
    } else if(kind === 'crossroads'){
      html = '<p>The way divides, inside '+world+'.</p><p>'+pk(['One way is lit; the other is honest.','One way is shorter; the other is yours.','One way everyone takes; the other one waits.'])+'</p>';
      choices = [ { label:'⬆️ The first way' }, { label:'↗️ The second way' } ];
    } else if(kind === 'wonder'){
      html = '<p>For a moment, the world of '+world+' simply… shows off.</p><p>'+pk(['Light does something you have no name for.','Everything aligns, briefly, and beautifully.','It is the kind of moment journeys are actually for.'])+'</p>';
      choices = [ { label:'✨ Linger a while' }, { label:'▶ Walk on' } ];
    } else {
      html = '<p>Here the world of '+world+' tests whether you truly came to <b>'+act+'</b>.</p>';
      choices = [ { label:'✦ Face the test' }, { label:'▶ Go around — find another way' } ];
    }
    return { id:id, kind:'situation', imgKind:kind, stepNo:n, html:html, choices:choices, branches:null };
  }
  var om = /^o(\d+)([ab])$/.exec(id);
  if(om){
    var sn = parseInt(om[1], 10), skind = mxSitKind(game, sn), r2 = mxRng(game.id+':'+id), ohtml = '', eff = null;
    if(skind === 'meeting'){
      var nm2 = mxSitName(game, sn);
      if(om[2] === 'a'){ eff = { insight:1, met:nm2 }; ohtml = '<p>You '+act+' — and '+nm2+' answers in kind. Something in the world of '+world+' shifts, slightly, permanently.</p><p class="dim">✦ Insight gained · '+nm2+' will remember this meeting.</p>'; }
      else { eff = { met:nm2 }; ohtml = '<p>A greeting, honestly given, honestly received. Not every meeting must become work.</p><p class="dim">'+nm2+' walks on. So do you.</p>'; }
    } else if(skind === 'discovery'){
      if(om[2] === 'a'){ eff = { insight:1 }; ohtml = '<p>The closer you look, the more there is. That is the tax and the gift of '+world+'.</p><p class="dim">✦ Insight gained.</p>'; }
      else ohtml = '<p>Some discoveries are for carrying, not for solving. You carry this one.</p>';
    } else if(skind === 'making'){
      if(om[2] === 'a'){ eff = { insight:1 }; ohtml = '<p>It takes longer than expected. It usually does. But when it is done, the place is different — and so, a little, are you.</p><p class="dim">✦ Insight gained. The work holds.</p>'; }
      else ohtml = '<p>You leave the unfinished thing for whoever it is truly meant for. The road keeps its own counsel.</p>';
    } else if(skind === 'crossroads'){
      ohtml = om[2] === 'a' ? '<p>You take it, and do not look back. Looking back is a different game.</p>' : '<p>You take it, and the world of '+world+' rearranges itself around the choice, quietly.</p>';
    } else if(skind === 'wonder'){
      if(om[2] === 'a'){ eff = { insight:1 }; ohtml = '<p>You linger. The moment does not mind. When you walk on, it walks with you a while.</p><p class="dim">✦ Insight gained.</p>'; }
      else ohtml = '<p>You nod to the wonder, the way you nod to weather, and keep your pace.</p>';
    } else {
      if(om[2] === 'a'){
        if(r2() < 0.7){ eff = { insight:1 }; ohtml = '<p>It is not easy. It was never going to be. But the way through was exactly the way you chose — and it holds.</p><p class="dim">✦ Insight gained.</p>'; }
        else ohtml = '<p>The test wins this round — fairly. What it teaches is worth more than the win would have been: you see now how '+world+' truly works.</p><p class="dim">A lesson, carried forward.</p>';
      } else ohtml = '<p>Around is also a direction. The test keeps its dignity; you keep your road.</p>';
    }
    return { id:id, kind:'outcome', imgKind:skind, html:ohtml, effects:eff, choices:[ { label:'▶ Continue' } ], branches:null };
  }
  return { id:id, kind:'arrival', imgKind:'arrival', html:'<p>The way continues.</p>', choices:[ { label:'▶ Continue' } ], branches:null };
}
function mxBranchTarget(game, screen, idx){
  var c = screen.choices[idx];
  if(!c || c.disabled) return null;
  if(screen.kind === 'title') return 'arr-' + c.len;
  if(screen.kind === 'arrival') return 's1';
  if(screen.kind === 'situation') return 'o' + screen.stepNo + (idx === 0 ? 'a' : 'b');
  if(screen.kind === 'outcome'){ var n = parseInt(screen.id.slice(1), 10); return n >= game.len ? 'finale' : 's' + (n+1); }
  return null;
}
/* Generate ONLY the branches of this screen — one step ahead, never more. */
function mxExpand(game, screen){
  if(!screen || screen.branches) return;
  screen.branches = screen.choices.map(function(c, i){
    var t = mxBranchTarget(game, screen, i);
    if(!t) return null;
    if(!game.screens[t]) game.screens[t] = mxGenScreen(game, t);
    return t;
  });
}
/* At creation: the first screen + its branches. Nothing beyond exists. */
function mxFirstScreens(game){
  game.screens = {};
  game.screens['title'] = mxGenScreen(game, 'title');
  game.currentId = 'title';
  mxExpand(game, game.screens['title']);
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
(function(){
'use strict';
function qparam(n){ var m = new RegExp('[?&]'+n+'=(\\d+)').exec(location.search); return m ? parseInt(m[1],10) : 0; }
var gm = /[?&]g=x(\d+)y(\d+)/.exec(location.search);
var X = gm ? parseInt(gm[1],10)-1 : qparam('x')-1;
var Y = gm ? parseInt(gm[2],10)-1 : qparam('y')-1;
var GID = 'x'+(X+1)+'y'+(Y+1);
var sceneImg = document.getElementById('sceneImg'),
    descEl = document.getElementById('desc'),
    choicesEl = document.getElementById('choices'),
    chipsEl = document.getElementById('chips');
document.getElementById('fsBtn').onclick = function(){
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); }
};
if(X<0 || X>35 || Y<0 || Y>35){
  descEl.innerHTML = '<p>This cell does not exist. The map holds 36 × 36 of them.</p><p><a href="index.html">Back to the matrix</a></p>';
  return;
}
var cover = 'data:image/svg+xml;utf8,' + encodeURIComponent(tileSVG(X, Y, 480));
sceneImg.src = cover;
var curScene = null;
/* Every screen generates its own picture: same art family as the cover
   (palette from the cell), composed from the situation + the step. */
function sceneFor(kind, salt){
  var glyphs = { arrival:'🚪', meeting:'👥', discovery:'🔭', making:'🛠️', crossroads:'🛤️', wonder:'✨', challenge:'⚡', finale:'🌙' };
  var labels = { arrival:'Arrival', meeting:'A meeting', discovery:'A discovery', making:'The work', crossroads:'A crossroads', wonder:'Wonder', challenge:'A test', finale:'The end of the road' };
  var yg = Math.floor(Y/6), xg = Math.floor(X/6);
  var hueY = [210, 160, 95, 265, 28, 318][yg] + (Y%6)*7;
  var hueX = [200, 150, 80, 255, 20, 300][xg] + (X%6)*6;
  var h = ((X+1)*73856093) ^ ((Y+1)*19349663) ^ mxHashStr(salt || kind) ^ (kind.length*97 + kind.charCodeAt(0)*13);
  function rnd(){ h = (h*1103515245 + 12345) & 0x7fffffff; return h/0x7fffffff; }
  var ang = Math.floor(rnd()*360), circles = '', i;
  for(i=0;i<3;i++){ circles += '<circle cx="'+Math.floor(30+rnd()*260)+'" cy="'+Math.floor(20+rnd()*110)+'" r="'+Math.floor(14+rnd()*38)+'" fill="hsl('+(i%2 ? hueY : hueX)+',85%,68%)" opacity="'+(0.13+rnd()*0.12).toFixed(2)+'"/>'; }
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">' +
    '<defs><linearGradient id="sg" gradientTransform="rotate('+ang+' 0.5 0.5)">' +
    '<stop offset="0" stop-color="hsl('+hueY+',55%,'+(24+Math.floor(rnd()*8))+'%)"/><stop offset="1" stop-color="hsl('+hueX+',60%,15%)"/></linearGradient></defs>' +
    '<rect width="320" height="180" fill="url(#sg)"/>' + circles +
    '<text x="160" y="98" font-size="58" text-anchor="middle">'+(glyphs[kind]||'✨')+'</text>' +
    '<text x="288" y="130" font-size="25" text-anchor="middle">'+XCAT[X][1]+'</text>' +
    '<rect y="146" width="320" height="34" fill="rgba(8,6,14,0.72)"/>' +
    '<text x="160" y="168" font-size="15" fill="#f2ead9" text-anchor="middle" font-family="Verdana,sans-serif">'+cellCode(X, Y)+' · '+(labels[kind]||'')+'</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
/* Each game's own poster — vertical 9:16, generated from its cell:
   family palette, the X motif, the game's title and code. */
function posterFor(){
  var yg = Math.floor(Y/6), xg = Math.floor(X/6);
  var hueY = [210, 160, 95, 265, 28, 318][yg] + (Y%6)*7;
  var hueX = [200, 150, 80, 255, 20, 300][xg] + (X%6)*6;
  var h = ((X+3)*40503) ^ ((Y+5)*889523);
  function rnd(){ h = (h*1103515245 + 12345) & 0x7fffffff; return h/0x7fffffff; }
  var stars = '', i;
  for(i=0;i<14;i++){ stars += '<circle cx="'+Math.floor(8+rnd()*164)+'" cy="'+Math.floor(8+rnd()*130)+'" r="'+(0.8+rnd()*1.4).toFixed(1)+'" fill="#ffe9b0" opacity="'+(0.35+rnd()*0.5).toFixed(2)+'"/>'; }
  var sunX = 30+Math.floor(rnd()*120), sunR = 13+Math.floor(rnd()*10);
  function fit(s){ return s.length > 19 ? 12.5 : (s.length > 14 ? 14.5 : 16.5); }
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320">' +
    '<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="hsl('+hueY+',58%,30%)"/><stop offset="0.62" stop-color="hsl('+hueX+',58%,20%)"/><stop offset="1" stop-color="hsl('+hueX+',62%,12%)"/></linearGradient></defs>' +
    '<rect width="180" height="320" fill="url(#pg)"/>' + stars +
    '<circle cx="'+sunX+'" cy="'+(58+Math.floor(rnd()*26))+'" r="'+sunR+'" fill="hsl('+hueX+',85%,70%)" opacity="0.85"/>' +
    '<circle cx="26" cy="252" r="66" fill="hsl('+hueY+',50%,18%)"/>' +
    '<circle cx="158" cy="266" r="78" fill="hsl('+hueX+',52%,14%)"/>' +
    '<circle cx="90" cy="292" r="70" fill="hsl('+hueY+',48%,10%)"/>' +
    '<text x="90" y="34" font-size="11.5" fill="#ffd98a" text-anchor="middle" font-family="Verdana,sans-serif" letter-spacing="2">'+cellCode(X, Y)+'</text>' +
    '<text x="90" y="152" font-size="62" text-anchor="middle">'+XCAT[X][1]+'</text>' +
    '<text x="90" y="196" font-size="'+fit(XCAT[X][0])+'" fill="#f2ead9" text-anchor="middle" font-family="Georgia,serif" font-weight="bold">'+XCAT[X][0]+'</text>' +
    '<text x="90" y="216" font-size="13" fill="#b7a9d6" text-anchor="middle" font-family="Georgia,serif">×</text>' +
    '<text x="90" y="238" font-size="'+fit(YCAT[Y][0])+'" fill="#f2ead9" text-anchor="middle" font-family="Georgia,serif" font-weight="bold">'+YCAT[Y][0]+'</text>' +
    '<text x="90" y="308" font-size="9.5" fill="#9a8bc0" text-anchor="middle" font-family="Verdana,sans-serif" letter-spacing="3">ZENSWIPE GAMES · 36 × 36</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
var poster = posterFor();

/* ---------- storage: the game is generated ONCE, then saved ---------- */
var KEY = 'mx36_game_' + GID;
try { if(!localStorage.getItem(KEY)){ var legacySave = localStorage.getItem('mx36_' + (X+1) + '_' + (Y+1)); if(legacySave) localStorage.setItem(KEY, legacySave); } } catch(e){}
var store = {
  get: function(){ try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
  set: function(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} }
};
function hashSeed(a, b){ var h = (a*73856093) ^ (b*19349663) ^ 0x36; return function(){ h = (h*1103515245 + 12345) & 0x7fffffff; return h/0x7fffffff; }; }
var FIRST = ['Ka','Vor','Sy','Mi','An','Tor','Ze','Bel','Ond','Ru','Fen','Gal','Il','Ash','Nor','Ek'];
var MID = ['ber','la','mir','fen','ra','sil','to','van','ori','um','ek','dor'];
var LAST = ['is','ax','une','or','ia','eth','on','ara','ix','um'];
var PL1 = ['the Gate of','the Field of','the House of','the Shore of','the Tower of','the Garden of','the Bridge of','the Well of'];
var PL2 = ['First Light','Quiet Signals','Long Practice','the Turning','Small Hours','the Answer','Beginnings','the Deep Work'];

/* ---------- generate this cell's game (first visit only) ---------- */
var G = store.get();
if(!G){
  var R = hashSeed(X+3, Y+7);
  function pk(a){ return a[Math.floor(R()*a.length)]; }
  G = {
    v: 1, x: X, y: Y, id: GID, name: cellTitle(X, Y), code: cellCode(X, Y), frame: 'three-block',
    created: new Date().toISOString(),
    hero: pk(FIRST)+pk(MID)+pk(LAST),
    place: pk(PL1)+' '+pk(PL2),
    seedNote: Math.floor(R()*900000+100000),
    steps: 0, len: 0, insights: 0, met: [], seen: [], started: false, finished: false
  };
  store.set(G);
  try { var reg = JSON.parse(localStorage.getItem('mx36_registry') || '{}'); if(!reg[GID]){ reg[GID] = { x: X, y: Y, name: G.name, created: G.created }; localStorage.setItem('mx36_registry', JSON.stringify(reg)); } } catch(e){}
}
var rng = hashSeed(X+11, Y+13);
function pick(a){ return a[Math.floor(rng()*a.length)]; }
function save(){ store.set(G); }
var title = cellTitle(X, Y), code = cellCode(X, Y);
var act = XCAT[X][2], world = YCAT[Y][1];

function chips(){
  chipsEl.innerHTML =
    '<span class="chip"><b>'+code+'</b></span>'+
    '<span class="chip">'+G.hero+'</span>'+
    (G.len ? '<span class="chip">👣 step '+Math.min(G.steps+1, G.len)+' of '+G.len+'</span>' : '')+
    '<span class="chip">✦ '+G.insights+'</span>';
}
function show(html, choices, img){
  document.getElementById('picWrap').classList.toggle('poster', img === poster);
  sceneImg.src = img || curScene || cover;
  descEl.innerHTML = html; descEl.scrollTop = 0;
  choicesEl.innerHTML = '';
  choices.forEach(function(c, i){
    if(c.disabled){
      var dv = document.createElement('div');
      dv.className = 'choice disabled';
      dv.innerHTML = c.label + (c.hint ? '<span class="hint">'+c.hint+'</span>' : '');
      choicesEl.appendChild(dv); return;
    }
    var b = document.createElement('button');
    b.className = 'choice'+(i===0?' primary':'');
    b.innerHTML = c.label + (c.hint ? '<span class="hint">'+c.hint+'</span>' : '');
    b.onclick = c.act;
    choicesEl.appendChild(b);
  });
  chips(); save();
}
/* ---------- the graph player: only one step ahead ever exists ---------- */
if(!G.screens) mxFirstScreens(G);
if(!G.currentId) G.currentId = 'title';
function imgFor(sc){
  if(sc.kind === 'title') return poster;
  return sceneFor(sc.imgKind || 'wonder', sc.id);
}
function render(){
  var sc = G.screens[G.currentId];
  if(!sc){ G.currentId = 'title'; sc = G.screens['title']; }
  if(!sc.entered){
    sc.entered = true;
    if(sc.effects){
      if(sc.effects.insight) G.insights += sc.effects.insight;
      if(sc.effects.met && G.met.indexOf(sc.effects.met) < 0) G.met.push(sc.effects.met);
    }
    if(sc.stepNo) G.steps = Math.max(G.steps, sc.stepNo);
    if(sc.kind === 'finale') G.finished = true;
  }
  mxExpand(G, sc);
  var html = sc.html;
  if(sc.kind === 'finale'){
    html = html.replace('{{len}}', G.len).replace('{{insights}}', G.insights)
               .replace('{{met}}', G.met.length ? G.met.join(', ') : 'no one — a solitary road')
               .replace('{{steps}}', G.steps);
  }
  var choices = sc.choices.map(function(c, i){
    return { label: c.label, hint: c.hint, disabled: !!c.disabled,
             act: function(){ follow(sc, i); } };
  });
  if(sc.kind === 'title' && G.started && !G.finished)
    choices.push({ label:'🔁 Begin this game again', act: resetGraph });
  if(sc.kind === 'finale')
    choices.push({ label:'🔁 A new journey in this game', act: resetGraph });
  choices.push({ label:'🗺️ Back to the matrix', act: function(){ location.href = 'index.html'; } });
  show(html, choices, imgFor(sc));
}
function follow(sc, i){
  var c = sc.choices[i];
  if(c.len){ G.len = c.len; G.started = true; G.finished = false; G.steps = 0; G.insights = 0; G.met = []; }
  var t = sc.branches && sc.branches[i];
  if(t){ G.currentId = t; }
  render();
}
function resetGraph(){
  G.steps = 0; G.len = 0; G.insights = 0; G.met = []; G.seen = []; G.started = false; G.finished = false;
  mxFirstScreens(G);
  render();
}
render();

})();
</script>
</body>
</html>
