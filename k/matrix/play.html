<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenSwipe Games - the engine</title></head>
<body style="background:#0d0b14;color:#cfc7e8;font-family:Georgia,serif;text-align:center;padding-top:40vh">
<p>Opening the engine...</p>
<script>
var q = new URLSearchParams(location.search);
var g = q.get('g');
if (!g && q.get('x') && q.get('y')) g = 'x' + q.get('x') + 'y' + q.get('y');
location.replace('index.html' + (g ? ('#g=' + g) : ''));
</script>
</body></html>
