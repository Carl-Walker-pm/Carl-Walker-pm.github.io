<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Equations — New Technology. New Solutions.</title>
<meta name="description" content="Quantum Equations: new technology, new solutions — a wide spectrum.">
<!-- analytics: GA4 / Clarity / PostHog — install when the Measurement ID is available (standing rule: never drop counters in a rebuild) -->
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    background:#0b0e17; color:#eef1f7; line-height:1.6;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .spectrum{
    height:6px;
    background:linear-gradient(90deg,#7c3aed,#2563eb,#06b6d4,#22c55e,#eab308,#f97316,#ef4444);
  }
  main{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:48px 24px;}
  .hero{max-width:720px;}
  .eyebrow{letter-spacing:6px; font-size:12px; text-transform:uppercase; color:#8b93a7; margin-bottom:24px;}
  h1{font-size:clamp(40px,7vw,68px); font-weight:700; letter-spacing:-1px; margin-bottom:20px;}
  h1 .q{background:linear-gradient(90deg,#a78bfa,#60a5fa,#67e8f9,#6ee7b7,#fde047,#fdba74,#fca5a5);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .tag{font-size:clamp(18px,3vw,24px); color:#c7cddc; margin-bottom:12px;}
  .tag strong{color:#fff; font-weight:600;}
  .wide{font-size:15px; letter-spacing:3px; text-transform:uppercase; color:#8b93a7; margin-top:28px;}
  .soon{margin-top:40px; font-size:14px; color:#6b7280;}
  footer{border-top:1px solid #1c2233; padding:20px 24px; text-align:center; font-size:13px; color:#6b7280;}
</style>
</head>
<body>
<div class="spectrum" aria-hidden="true"></div>
<main>
  <div class="hero">
    <div class="eyebrow">Quantum Equations</div>
    <h1><span class="q">Quantum Equations</span></h1>
    <p class="tag"><strong>New Technology.</strong> <strong>New Solutions.</strong></p>
    <p class="wide">Wide spectrum</p>
    <p class="soon">More soon.</p>
  </div>
</main>
<div class="spectrum" aria-hidden="true"></div>
<footer>&copy; 2026 Quantum Equations</footer>
</body>
</html>
