<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic-auth builder</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.5; }
  h1 { font-size: 22px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px; border: 1px solid #999; border-radius: 6px; }
  textarea { min-height: 72px; }
  button { margin-top: 16px; padding: 10px 18px; font-size: 15px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #1a1a1a; margin-left: 8px; }
  .note { margin-top: 24px; font-size: 13px; color: #555; }
  #status { margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<h1>Basic-auth builder</h1>
<p>Builds the one-line <code>Basic &lt;base64(...)&gt;</code> value for API tokens — Confluence (email + token) or Cursor (API key as the username, empty password).</p>
<label for="service">Service</label>
<select id="service">
  <option value="confluence">Confluence (Atlassian)</option>
  <option value="cursor">Cursor</option>
</select>
<div id="emailRow">
<label for="email">Email</label>
<input id="email" type="text" value="admin@4dux.net" autocomplete="off">
</div>
<label for="token" id="tokenLabel">API token</label>
<input id="token" type="password" autocomplete="off" placeholder="Paste the API token">
<button id="build" type="button">Build</button>
<button id="copy" type="button" class="secondary">Copy result</button>
<label for="out">Result — paste this whole line as the credential value</label>
<textarea id="out" readonly placeholder="Basic ..."></textarea>
<p id="status"></p>
<p class="note">Runs entirely in your browser. Nothing is sent anywhere, nothing is stored. Clear this page when you are done.</p>
<script>
(function () {
  function b64utf8(s) {
    var bytes = new TextEncoder().encode(s);
    var bin = "";
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  var service = document.getElementById("service");
  var emailRow = document.getElementById("emailRow");
  var email = document.getElementById("email");
  var token = document.getElementById("token");
  var tokenLabel = document.getElementById("tokenLabel");
  var out = document.getElementById("out");
  var status = document.getElementById("status");
  service.addEventListener("change", function () {
    var isCursor = service.value === "cursor";
    emailRow.style.display = isCursor ? "none" : "";
    tokenLabel.textContent = isCursor ? "Cursor API key" : "API token";
    token.placeholder = isCursor ? "Paste the Cursor API key (starts with crsr_)" : "Paste the API token";
    out.value = "";
    status.textContent = "";
  });
  document.getElementById("build").addEventListener("click", function () {
    var e = email.value.trim();
    var t = token.value.trim();
    if (service.value === "cursor") {
      if (!t) { status.textContent = "Paste the Cursor API key first."; return; }
      if (t.indexOf("crsr_") !== 0 || t.length < 50) {
        status.textContent = "This does not look like a Cursor API key. A real key starts with crsr_ and is about 69 characters. Check what you pasted — if you see only a few dots there, it is the wrong paste.";
        return;
      }
      out.value = "Basic " + b64utf8(t + ":");
      var done = false;
      function copiedNoteCursor() {
        status.textContent = "Built and copied (" + out.value.length + " chars). Paste it into the form — the line must start with Basic.";
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(out.value).then(function () { done = true; copiedNoteCursor(); }, function () {
          status.textContent = "Built. Key looks right (" + t.length + " chars, starts with crsr_). Press Copy result — then paste a line of " + out.value.length + " chars into the form.";
        });
      } else {
        status.textContent = "Built. Key looks right (" + t.length + " chars, starts with crsr_). Press Copy result — then paste a line of " + out.value.length + " chars into the form.";
      }
      return;
    }
    if (!e || !t) { status.textContent = "Enter both the email and the token."; return; }
    if (t.indexOf("ATATT") !== 0 || t.length < 50) {
      status.textContent = "This does not look like an Atlassian API token. A real token is a long code starting with ATATT (about 190 characters). Check what you pasted into the API token field — if you see only a few dots there, it is the wrong paste.";
      return;
    }
    out.value = "Basic " + b64utf8(e + ":" + t);
    var done = false;
    function copiedNote() {
      status.textContent = "Built and copied (" + out.value.length + " chars). Paste it into the form — the line must start with Basic.";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out.value).then(function () { done = true; copiedNote(); }, function () {
        status.textContent = "Built. Token looks right (" + t.length + " chars, starts with ATATT). Press Copy result — then paste a line of " + out.value.length + " chars into the form.";
      });
    } else {
      status.textContent = "Built. Token looks right (" + t.length + " chars, starts with ATATT). Press Copy result — then paste a line of " + out.value.length + " chars into the form.";
    }
  });
  document.getElementById("copy").addEventListener("click", function () {
    if (!out.value) { status.textContent = "Nothing to copy yet — press Build first."; return; }
    out.select();
    function manual() {
      status.textContent = "Copy did not work — long-press the result above, Select all, Copy.";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out.value).then(function () {
        status.textContent = "Copied.";
      }, function () {
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        if (ok) { status.textContent = "Copied."; } else { manual(); }
      });
    } else {
      var ok2 = false;
      try { ok2 = document.execCommand("copy"); } catch (e) { ok2 = false; }
      if (ok2) { status.textContent = "Copied."; } else { manual(); }
    }
  });
})();
</script>
</body>
</html>
